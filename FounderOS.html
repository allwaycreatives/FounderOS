<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Founder OS — AWOS</title>
<meta name="theme-color" content="#121212" />
<!--
  Optional PWA support: if this file is ever hosted (rather than opened via
  file://) alongside a manifest.json and sw.js in the same folder, it becomes
  installable with no changes to this file. Both are harmless to omit — a
  missing manifest just means the browser never shows an install prompt.
-->
<link rel="manifest" href="./manifest.json" />
<style>
/* ==========================================================================
   SELF-HOSTED FONTS (Poppins / Inter — AWDS Section 4)
   Local files only, next to this HTML file at assets/fonts/ — never a CDN
   reference (fonts.googleapis.com / fonts.gstatic.com), so the offline /
   file:// guarantee holds. If a file is missing, the browser silently falls
   back to the system stack in --font-display / --font-body (see :root) —
   nothing breaks, it just renders with system fonts until the files exist.

   font-weight is declared as a RANGE per file, not a single value. This app
   uses a custom weight (650) for most emphasis text — not a real static cut
   any font ships — so instead of leaving that to unpredictable per-browser
   nearest-weight matching, each range explicitly claims the requests it
   should serve. Exact files/weights required:
     assets/fonts/Poppins-SemiBold.woff2  (headings — every heading in this
       app uses weight 650; there is no true H1/Bold moment currently)
     assets/fonts/Poppins-Bold.woff2      (not used yet, but AWDS Section 4
       calls for Bold at H1 — wired up and ready for when that's needed)
     assets/fonts/Inter-Regular.woff2     (default body text, weight 400)
     assets/fonts/Inter-Medium.woff2      (weight 500 — labels, captions)
     assets/fonts/Inter-SemiBold.woff2    (weights 600 AND 650 — card titles,
       mission titles, and other body-inherited emphasis text; this file is
       required even though only Regular/Medium were expected, see chat) */
@font-face{
  font-family: "Poppins";
  font-weight: 550 675; /* covers this app's actual 650 heading usage */
  font-style: normal;
  font-display: swap;
  src: url("./assets/fonts/Poppins-SemiBold.woff2") format("woff2");
}
@font-face{
  font-family: "Poppins";
  font-weight: 676 900; /* Bold+ — available, not yet used anywhere */
  font-style: normal;
  font-display: swap;
  src: url("./assets/fonts/Poppins-Bold.woff2") format("woff2");
}
@font-face{
  font-family: "Inter";
  font-weight: 100 450; /* Regular — default/unstyled body text */
  font-style: normal;
  font-display: swap;
  src: url("./assets/fonts/Inter-Regular.woff2") format("woff2");
}
@font-face{
  font-family: "Inter";
  font-weight: 451 549; /* Medium */
  font-style: normal;
  font-display: swap;
  src: url("./assets/fonts/Inter-Medium.woff2") format("woff2");
}
@font-face{
  font-family: "Inter";
  font-weight: 550 900; /* SemiBold — covers both explicit 600 and this app's 650 */
  font-style: normal;
  font-display: swap;
  src: url("./assets/fonts/Inter-SemiBold.woff2") format("woff2");
}
/* ==========================================================================
   FOUNDER OS — DESIGN TOKENS
   Retheme v1.1: brought into the All Way Creatives Design System (AWDS
   v1.3). Core colors, text hierarchy, and semantic colors now map exactly
   to AWDS tokens. The glass/blur panel treatment, radial gradients, and
   the compact 3-tier radius scale are Founder OS-specific extensions
   layered on top of the shared AWDS base — not part of AWDS itself, but
   compatible with it (see AWDS Section 2 on per-product extensions).
   Typography uses self-hosted Poppins/Inter (local .woff2 files, no CDN)
   per AWDS Section 4 — this satisfies the offline/file:// zero-network
   constraint without falling back to the system font stack, since no
   external request is ever made. The system stack is retained only as a
   fallback tail in case assets/fonts/ is ever missing (see the Type
   comment just below).
   ========================================================================== */
:root{
  /* Surfaces — mapped to AWDS core palette */
  --bg:            #121212;  /* = AWDS --aw-background */
  --bg-alt:        #161616;  /* Founder OS extension: subtle alt tone for gradient depth */
  --panel:         rgba(255,255,255,0.035);  /* Founder OS extension: glass overlay, not in AWDS */
  --panel-solid:   #1E1E1E;  /* = AWDS --aw-surface */
  --panel-border:  rgba(255,255,255,0.08);   /* Founder OS extension: translucent glass border */
  --panel-border-strong: rgba(255,255,255,0.14);
  --raised:        #2B2B2B;  /* = AWDS --aw-surface-raised */

  /* Text — mapped to AWDS core palette */
  --text-primary:   #FFFFFF;  /* = AWDS --aw-text-primary */
  --text-secondary: #A0A0A0;  /* = AWDS --aw-text-secondary */
  --text-tertiary:  #5C5C5C;  /* = AWDS --aw-text-disabled */

  /* Accents — mapped to AWDS palette (amber renamed to primary, same role) */
  --amber:      #ED8D01;  /* = AWDS --aw-primary (confirmed logo color) */
  --amber-dim:  rgba(237,141,1,0.14);
  --amber-line: rgba(237,141,1,0.35);
  --blue:       #3E9EE0;  /* = AWDS --aw-info */
  --blue-dim:   rgba(62,158,224,0.14);
  --warn:       #E0A93E;  /* = AWDS --aw-warning — previously unmapped locally; success/error/info
                              all had local tokens already, warning didn't. Added for the demo banner. */
  --warn-dim:   rgba(224,169,62,0.14);
  --warn-line:  rgba(224,169,62,0.35);
  --green:      #3EBD6F;  /* = AWDS --aw-success */
  --green-dim:  rgba(62,189,111,0.14);
  --red:        #E5484D;  /* = AWDS --aw-error */
  --red-dim:    rgba(229,72,77,0.14);

  /* Type — self-hosted Poppins/Inter per AWDS Section 4, with the system
     stack retained as a fallback tail (not removed) so the app still
     renders correctly even if assets/fonts/ is ever missing or incomplete.
     See the @font-face block below for exactly which local files/weights
     this depends on. */
  --font-display: "Poppins", -apple-system, "SF Pro Display", "Segoe UI Semibold", ui-sans-serif, system-ui, sans-serif;
  --font-body:    "Inter", -apple-system, "SF Pro Text", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  --font-mono:    ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;

  /* Rhythm — radius: sm/md now land exactly on AWDS Input/Card radii; lg
     nudged from 22px to 20px to match AWDS Modal radius exactly. This
     compact 3-tier scale (vs AWDS's 4-tier) is a deliberate Founder
     Console extension for its denser data UI — see retheme notes.
     Retheme v1.2: the 3-tier scale was actually missing the AWDS Button
     radius (12px, distinct from Input's 10px) — buttons and inputs were
     incorrectly sharing --radius-sm. Restored as a 4th token below. */
  --radius-sm: 10px;   /* = AWDS --aw-radius-input */
  --radius-md: 16px;   /* = AWDS --aw-radius-card */
  --radius-lg: 20px;   /* = AWDS --aw-radius-modal (was 22px) */
  --radius-button: 12px; /* = AWDS --aw-radius-button (Section 6) — added in retheme v1.2 */
  --shadow-modal: 0 8px 32px rgba(0,0,0,.4), 0 0 0 1px var(--panel-border-strong); /* = AWDS Section 7 modal elevation spec, using this file's existing border token in place of AWDS's solid --aw-border */
  --focus-ring: rgba(237,141,1,0.6); /* = AWDS --aw-focus-ring (Section 3) — 60% opacity amber, 2px */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --sidebar-w: 248px;
  --sidebar-w-collapsed: 76px;
  --transition: 220ms cubic-bezier(.4,0,.2,1);
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

*, *::before, *::after{ box-sizing: border-box; }
html, body{ height: 100%; }
body{
  margin: 0;
  background: radial-gradient(1200px 800px at 15% -10%, #181818 0%, var(--bg) 55%) fixed;
  color: var(--text-primary);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
::selection{ background: var(--amber-dim); color: var(--amber); }
a{ color: inherit; }
/* Defensive fallback: every icon in this app (133 uses of icon()) relies on
   being wrapped in a container with its own specific sizing rule, e.g.
   .nav-icon svg{width:17px}. There's never been a base default — so any
   icon dropped into new markup without a matching wrapper rule renders at
   the browser's raw intrinsic SVG size (~300x150px), stretched to fit a
   24x24 viewBox, which is exactly the kind of giant/distorted icon that's
   otherwise very easy to introduce by accident. This bare `svg` rule is
   lower-specificity than every existing `.thing svg` rule above and below
   it, so nothing currently correctly sized changes — this only catches the
   case where nothing more specific exists at all. */
svg{ width: 16px; height: 16px; }
button{ font-family: inherit; }
::-webkit-scrollbar{ width: 8px; height: 8px; }
::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.09); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover{ background: rgba(255,255,255,0.16); }

:focus-visible{ outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: 6px; }

.skip-link{
  position: absolute; top: -48px; left: 12px; z-index: 500;
  background: var(--amber); color: var(--aw-text-on-primary,#1A1206); font-weight: 650; font-size: 13px;
  padding: 10px 16px; border-radius: var(--radius-sm); text-decoration: none;
  transition: top var(--transition);
}
.skip-link:focus{ top: 12px; }

/* ==========================================================================
   APP SHELL
   ========================================================================== */
#app{ display: flex; min-height: 100vh; }

.glass{
  background: var(--panel);
  border: 1px solid var(--panel-border);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
}
/* Redesign pass: every clickable card in the app (project/contact/client-
   project/note/knowledge-article rows — see the data-action attributes on
   each) previously relied on inline style="cursor:pointer" with zero visual
   hover feedback at all — clicking one worked, but nothing on screen ever
   suggested it was clickable until the cursor happened to change. This is
   the one thing every reference app named (Slack, Notion, Teams, Zoho,
   Claude itself) treats as table-stakes: a clickable row visibly responds.
   Kept deliberately subtle — border brightening to the same --panel-
   border-strong already used for modals, a faint surface lift, and a 1px
   nudge rather than a dramatic shadow/scale effect, so it reads as
   "responsive" rather than "flashy" against AWDS's minimal aesthetic. */
.card-clickable{ cursor: pointer; transition: border-color var(--transition), background var(--transition), transform var(--transition); }
.card-clickable:hover{ border-color: var(--panel-border-strong); background: rgba(255,255,255,0.055); transform: translateY(-1px); }
.card-clickable:active{ transform: translateY(0); }

/* ---- Sidebar ---- */
.sidebar{
  width: var(--sidebar-w);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: var(--space-5) var(--space-3);
  border-right: 1px solid var(--panel-border);
  background: rgba(18,18,18,0.6);
  transition: width var(--transition);
  position: sticky; top: 0; height: 100vh; z-index: 40;
  overflow-y: auto; overflow-x: hidden;
}
.sidebar.collapsed{ width: var(--sidebar-w-collapsed); }

.brand{
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-6) var(--space-2) var(--space-5) var(--space-2);
  border-bottom: 1px solid var(--panel-border);
  white-space: nowrap; overflow: hidden;
}
.brand{
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-6) var(--space-2) var(--space-5) var(--space-2);
  border-bottom: 1px solid var(--panel-border);
  white-space: nowrap; overflow: hidden;
}
.brand-mark{
  width: 34px; height: 34px; aspect-ratio: 1 / 1; border-radius: 10px; flex-shrink: 0; flex-grow: 0;
  background: var(--amber);
  display: flex; align-items: center; justify-content: center; overflow: visible;
  font-family: var(--font-mono); font-weight: 700; font-size: 13px; line-height: 1; color: var(--aw-text-on-primary,#1A1206);
  box-sizing: border-box;
}
.brand-text{ line-height: 1.15; overflow: hidden; }
.brand-title{ font-family: var(--font-display); font-weight: 650; font-size: 15px; letter-spacing: -0.01em; }
.brand-sub{ font-family: var(--font-body); font-size: 11.5px; font-weight: 500; color: var(--text-secondary); letter-spacing: 0.01em; margin-top: 1px; }

.nav-group{ margin-top: var(--space-4); }
.nav-label{
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-tertiary); padding: var(--space-2) var(--space-3); white-space: nowrap; overflow: hidden;
}
.nav-item{
  display: flex; align-items: center; gap: var(--space-3);
  padding: 9px var(--space-3); border-radius: var(--radius-sm);
  color: var(--text-secondary); text-decoration: none; cursor: pointer;
  font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden;
  border: 1px solid transparent; transition: background var(--transition), color var(--transition);
  margin-bottom: 2px; background: transparent; width: 100%; text-align: left;
}
.nav-item:hover{ background: rgba(255,255,255,0.045); color: var(--text-primary); }
.nav-item.active{
  background: var(--amber-dim); color: var(--amber);
  border-color: var(--amber-line);
}
.nav-icon{ width: 18px; height: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.nav-icon svg{ width: 17px; height: 17px; }
.nav-item-label{ overflow: hidden; text-overflow: ellipsis; }
.sidebar.collapsed .brand-text,
.sidebar.collapsed .nav-label,
.sidebar.collapsed .nav-item-label,
.sidebar.collapsed .season-chip-text{ display: none; }
.sidebar.collapsed .nav-item{ justify-content: center; }
.sidebar.collapsed .brand{ justify-content: center; padding-right: 0; }
/* Phase 6 follow-up: sub-steps mean tourStepIndex now drives currentView,
   not the other way around (see tourGoToStep()) — a manual sidebar click
   here would change currentView without moving the step index, desyncing
   the tour overlay from the screen actually showing. The tour's own
   Back/Next/Skip already cover navigation, so nav-items are inert (not
   hidden — the current screen should still show as active) while touring. */
.sidebar.touring .nav-item{ pointer-events: none; opacity: 0.55; }

.sidebar-footer{ margin-top: auto; }
.collapse-btn{
  display: flex; align-items: center; gap: var(--space-2); width: 100%;
  padding: 9px var(--space-3); border-radius: var(--radius-sm); background: transparent;
  border: 1px solid var(--panel-border); color: var(--text-tertiary); cursor: pointer; font-size: 12.5px;
}
.collapse-btn:hover{ color: var(--text-secondary); border-color: var(--panel-border-strong); }
.collapse-btn svg{ width: 15px; height: 15px; transition: transform var(--transition); flex-shrink:0; }
.sidebar.collapsed .collapse-btn svg{ transform: rotate(180deg); }
.sidebar.collapsed .collapse-btn span{ display: none; }

/* Phase 3: persistent demo-console banner. Lives above the topbar inside
   .main (not position:fixed/sticky) — it scrolls away with page content on
   a tall screen like anything else in .main's flow, but reappears on every
   navigateTo() re-render since it's keyed off STATE, not a per-screen thing.
   --warn (AWDS semantic "warning") rather than --amber: this is system
   feedback about the data being fake, not a branded action — Section 3
   reserves the semantic colors for exactly that distinction. */
.demo-banner{
  display: flex; align-items: center; gap: var(--space-4);
  padding: 10px var(--space-6);
  background: var(--warn-dim);
  border-bottom: 1px solid var(--warn-line);
  font-size: 13.5px;
}
.demo-banner-text{ color: var(--warn); font-weight: 500; flex: 1; min-width: 0; }
.demo-banner-action{
  background: transparent; border: 1px solid var(--warn-line); color: var(--warn);
  border-radius: var(--radius-sm); padding: 6px 13px; font-size: 13px; font-weight: 600;
  font-family: inherit; cursor: pointer; white-space: nowrap;
  transition: background var(--transition), color var(--transition);
}
.demo-banner-action:hover{ background: var(--warn); color: var(--bg); }
.demo-banner-dismiss{
  background: transparent; border: none; color: var(--warn); opacity: 0.7;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: var(--radius-sm); flex-shrink: 0;
}
.demo-banner-dismiss:hover{ opacity: 1; background: var(--warn-dim); }
.demo-banner-dismiss svg{ width: 14px; height: 14px; }
@media (max-width: 640px){
  .demo-banner{ flex-wrap: wrap; }
  .demo-banner-text{ flex-basis: 100%; }
}

/* Phase 6/6.1: guided tour overlay + spotlight. Originally a simple floating
   card over the fully-visible real screen; upgraded so each step now dims
   everything except the specific section being discussed (or the whole
   view content area, for steps without a specific data-tour target — see
   positionTourSpotlight()). Three pieces:
     .tour-scrim      full-viewport, invisible, just swallows clicks so the
                       tour's own Back/Next/Skip are the only way to act
                       while touring — visual dimming comes from the
                       spotlight's box-shadow, not this element's own fill.
     .tour-spotlight  positioned/sized in JS (position:absolute + scroll
                       offsets, not fixed — see positionTourSpotlight()) to
                       exactly frame the current target. Its box-shadow with
                       a huge spread is what creates the "everything else is
                       dark" cutout illusion; the box itself has no fill.
     .tour-card       the actual step content — sits above both (z:200).
   Sits above the topbar (z:30) and demo banner (normal flow) but below
   modals/focus-mode/splash (300/500), since a tour step and a modal are
   never expected to be open at once. Position transitions between steps,
   and the entrance animation, are both plain and short enough that the
   existing global prefers-reduced-motion rule (near the top of this
   stylesheet) already collapses them to instant on its own — no separate
   override needed, unlike the splash, because "skip straight to the static
   end state" (Phase 6 requirement 7) is literally what that rule does. */
.tour-scrim{ position: fixed; inset: 0; z-index: 190; }
.tour-spotlight{
  position: absolute; z-index: 195; pointer-events: none;
  border-radius: var(--radius-md);
  box-shadow: 0 0 0 9999px rgba(5,7,11,0.78);
  transition: top 320ms cubic-bezier(.4,0,.2,1), left 320ms cubic-bezier(.4,0,.2,1),
              width 320ms cubic-bezier(.4,0,.2,1), height 320ms cubic-bezier(.4,0,.2,1),
              opacity 200ms ease;
  opacity: 0;
}
.tour-overlay{
  position: fixed; left: 50%; bottom: var(--space-5); transform: translateX(-50%);
  z-index: 200; width: calc(100% - 48px); max-width: 560px;
}
.tour-card{
  background: var(--panel-solid); border: 1px solid var(--panel-border-strong);
  border-radius: var(--radius-md); padding: var(--space-5);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  animation: tourStepIn 260ms cubic-bezier(.4,0,.2,1) both;
}
@keyframes tourStepIn{ from{ opacity: 0; transform: translateY(10px); } to{ opacity: 1; transform: translateY(0); } }
.tour-step-indicator{
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--amber); margin-bottom: 6px;
}
.tour-title{ font-family: var(--font-display); font-size: 17px; font-weight: 650; margin-bottom: 6px; }
.tour-blurb{ font-size: 13.5px; color: var(--text-secondary); line-height: 1.45; margin-bottom: var(--space-4); }
.tour-actions{ display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
.tour-primary-actions{ display: flex; gap: var(--space-2); margin-left: auto; }
@media (max-width: 640px){
  .tour-overlay{ width: calc(100% - 24px); bottom: var(--space-3); }
  .tour-actions{ flex-direction: column-reverse; align-items: stretch; }
  .tour-primary-actions{ margin-left: 0; }
  .tour-primary-actions .btn{ flex: 1; }
}

/* ---- Main ---- */
.main{ flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar{
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-4) var(--space-6);
  border-bottom: 1px solid var(--panel-border);
  background: rgba(18,18,18,0.72);
  backdrop-filter: blur(14px);
}
.topbar-left{ display: flex; flex-direction: column; gap: 2px; }
.greeting{ font-family: var(--font-display); font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
.date-line{ font-size: 12.5px; color: var(--text-tertiary); font-family: var(--font-mono); }
.topbar-right{ display: flex; align-items: center; gap: var(--space-3); }

.season-chip{
  display: flex; align-items: center; gap: var(--space-2);
  padding: 7px 13px; border-radius: 999px;
  background: var(--amber-dim); border: 1px solid var(--amber-line); color: var(--amber);
  font-size: 12px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap;
  font-family: inherit; cursor: pointer; transition: background var(--transition);
}
.season-chip:hover{ background: rgba(232,165,75,0.22); }
.season-dot{ width: 6px; height: 6px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 3px var(--amber-dim); }

.icon-btn{
  width: 34px; height: 34px; border-radius: var(--radius-button);
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid var(--panel-border); color: var(--text-secondary); cursor: pointer;
  transition: background var(--transition), color var(--transition);
}
.icon-btn:hover{ background: rgba(255,255,255,0.05); color: var(--text-primary); }
.icon-btn svg{ width: 16px; height: 16px; }

.view{ padding: var(--space-6); max-width: 1400px; width: 100%; margin: 0 auto; flex: 1; }
.view-header{ margin-bottom: var(--space-5); }
.view-title{ font-family: var(--font-display); font-size: 22px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
.view-desc{ color: var(--text-tertiary); font-size: 13.5px; margin-top: 4px; }

/* ==========================================================================
   GRID / CARDS
   ========================================================================== */
.grid{ display: grid; gap: var(--space-4); }
.dash-grid{
  grid-template-columns: repeat(12, 1fr);
}
.col-12{ grid-column: span 12; }
.col-8{ grid-column: span 8; }
.col-4{ grid-column: span 4; }

.card{
  border-radius: var(--radius-md); /* AWDS Card radius (Section 6) — was incorrectly using Modal radius */
  padding: var(--space-5);
  position: relative;
  overflow: hidden;
}
.card-title{
  font-family: var(--font-display); font-size: 13.5px; font-weight: 650;
  letter-spacing: 0.01em; display: flex; align-items: center; gap: var(--space-2);
  color: var(--text-primary); margin: 0 0 var(--space-4) 0;
}
.card-title .card-icon{ color: var(--amber); display:flex; }
.card-title .card-icon svg{ width: 15px; height: 15px; }
.card-eyebrow{
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-tertiary); margin-bottom: var(--space-1);
}

/* ---- CEO Briefing HUD strip ---- */
.hud{
  border-radius: var(--radius-md); /* AWDS Card radius — the briefing strip is a card, not a modal */
  padding: var(--space-5) var(--space-6);
  display: flex; align-items: center; gap: var(--space-5);
  background: linear-gradient(135deg, rgba(232,165,75,0.09), rgba(255,255,255,0.02));
  border: 1px solid var(--amber-line);
  position: relative;
}
.hud::after{
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(100deg, transparent 30%, rgba(232,165,75,0.08) 48%, transparent 66%);
  background-size: 220% 100%;
  animation: sweep 3.4s ease-in-out 1;
}
@keyframes sweep{ 0%{ background-position: 140% 0; } 100%{ background-position: -40% 0; } }
.hud-icon{
  width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
  background: rgba(232,165,75,0.14); border: 1px solid var(--amber-line);
  display: flex; align-items: center; justify-content: center; color: var(--amber);
}
.hud-icon svg{ width: 22px; height: 22px; }
.hud-body{ min-width: 0; }
.hud-label{ font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); margin-bottom: 4px; }
.hud-text{ font-size: 14.5px; line-height: 1.55; color: var(--text-primary); }
.hud-text b{ color: var(--amber); font-weight: 650; }

/* ---- Mission list ---- */
.mission-row{
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-4) 0; border-bottom: 1px solid var(--panel-border);
}
.mission-row:last-child{ border-bottom: none; padding-bottom: 0; }
.mission-rank{
  font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary);
  width: 22px; flex-shrink: 0; text-align: center;
}
.mission-main{ flex: 1; min-width: 0; }
.mission-title{ font-size: 14px; font-weight: 600; margin-bottom: 3px; }
.mission-meta{ display: flex; gap: var(--space-3); flex-wrap: wrap; }
.tag{
  font-family: var(--font-mono); font-size: 10.5px; padding: 3px 8px; border-radius: 6px;
  display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
}
.tag-biz{ background: rgba(91,141,239,0.12); color: var(--blue); }
.tag-priority-high{ background: var(--red-dim); color: var(--red); }
.tag-priority-med{ background: var(--amber-dim); color: var(--amber); }
.tag-priority-low{ background: rgba(255,255,255,0.06); color: var(--text-secondary); }
.tag-time{ background: rgba(255,255,255,0.05); color: var(--text-tertiary); }

.progress-track{ width: 100%; height: 5px; border-radius: 4px; background: rgba(255,255,255,0.06); margin-top: var(--space-2); overflow: hidden; }

/* Phase 7: "How this got here" — static (no animation), demo-only affordance.
   Deliberately small and muted (11.5px, tertiary text color, no background)
   so it doesn't compete with the card's real content — this is a footnote,
   not a feature. Native <details>/<summary> means expand/collapse needs no
   JS state of its own; ::marker is hidden and replaced with the help icon
   already in the summary content, so there's no double-arrow/double-icon. */
.recipe-affordance{ margin-top: var(--space-2); }
.recipe-affordance summary{
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; color: var(--text-tertiary); cursor: pointer;
  list-style: none; user-select: none;
}
.recipe-affordance summary::-webkit-details-marker{ display: none; }
.recipe-affordance summary::marker{ content: ""; }
.recipe-affordance summary svg{ width: 12px; height: 12px; flex-shrink: 0; }
.recipe-affordance summary:hover{ color: var(--text-secondary); }
.recipe-affordance .recipe-body{
  margin-top: 6px; padding: var(--space-2) var(--space-3);
  background: rgba(255,255,255,0.03); border: 1px solid var(--panel-border);
  border-radius: var(--radius-sm); font-size: 12.5px; color: var(--text-secondary); line-height: 1.5;
}
.progress-fill{ height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--amber), #F5C073); transition: width 500ms cubic-bezier(.4,0,.2,1); }

.mission-side{ display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
.impact-score{ font-family: var(--font-mono); font-size: 17px; font-weight: 600; color: var(--amber); }
.impact-label{ font-size: 9.5px; color: var(--text-tertiary); font-family: var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; }

.btn{
  padding: 8px 15px; border-radius: var(--radius-button); font-size: 12.5px; font-weight: 600; /* AWDS Button radius (Section 6) */
  border: 1px solid var(--panel-border-strong); background: rgba(255,255,255,0.04); color: var(--text-primary);
  cursor: pointer; transition: background var(--transition), transform var(--transition), border-color var(--transition), box-shadow var(--transition);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover{ background: rgba(255,255,255,0.08); }
.btn:active{ transform: scale(0.97); }
.btn:disabled{ opacity: 0.4; cursor: not-allowed; pointer-events: none; }
/* AWDS Primary: orange fill, near-black text, medium shadow, hover = lift + brightness (Section 8) */
.btn-primary{
  background: var(--amber); border-color: var(--amber); color: var(--aw-text-on-primary,#1A1206);
  box-shadow: 0 2px 8px rgba(237,141,1,0.25);
}
.btn-primary:hover{ background: #F2AF4D; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(237,141,1,0.35); }
.btn-primary:active{ transform: scale(0.97); }
/* AWDS Secondary: transparent, orange border/text; hover = orange fill (Section 8). AWDS's written
   hover spec says "white text", but that reproduces the exact 2.5:1 contrast failure Section 3's
   changelog already fixed for Primary — using --aw-text-on-primary here instead, consistent with
   that fix rather than the literal (uncorrected) wording. Worth reconciling in AWDS itself. */
.btn-secondary{ background: transparent; border-color: var(--amber); color: var(--amber); }
.btn-secondary:hover{ background: var(--amber); border-color: var(--amber); color: var(--aw-text-on-primary,#1A1206); }
/* AWDS Ghost: transparent, no border (Section 8) — for labeled low-emphasis actions (Cancel, Back).
   Bare icon-only controls (.icon-btn) deliberately keep a visible border as a Founder OS extension:
   in this app's dense list/table rows, an icon with no border or label is hard to scan at a glance —
   flagging this the same way AWDS flags its own compatible-extension decisions, not silently deviating. */
.btn-ghost{ background: transparent; border-color: transparent; color: var(--text-secondary); }
.btn-ghost:hover{ background: rgba(255,255,255,0.06); }
.btn-sm{ padding: 6px 11px; font-size: 11.5px; }
.btn svg{ width: 13px; height: 13px; }

/* Brand OS's exact button spec (pasted from the live app), used only for the
   two Welcome-screen CTAs (Get Started / Learn More) so those two buttons
   match Brand OS pixel-for-pixel, per explicit direction to prioritize that
   over matching the rest of Founder OS's own buttons. These are additive
   MODIFIERS on top of the existing .btn base above (markup: class="btn
   btn--primary") rather than a redefinition of .btn itself — Brand OS's
   pasted CSS also defines its own bare `.btn` reset, but that class name is
   already Founder OS's app-wide button base, used on every other button in
   this app. Redefining it here would have silently changed every button
   everywhere, not just these two. Reusing the existing base is a translated
   equivalent, not a lookalike: same inline-flex/cursor/gap plumbing, same
   effect, just not a duplicate ruleset. Only the double-dash modifier names
   (`--primary`/`--secondary`) are Brand OS's, since those don't collide with
   Founder's own single-dash `.btn-primary`/`.btn-secondary`.

   --aw-* custom properties are Brand OS's names, not Founder OS's — pasted
   as-is they resolve to nothing. Translated below to Founder's actual local
   tokens: --aw-space-2 (16px) -> --space-4, --aw-space-4 (32px) -> --space-6,
   --aw-radius-button -> --radius-button (identical 12px value, just renamed),
   --aw-font-body -> --font-body (identical stack), --aw-text-primary ->
   --text-primary. --aw-motion-duration (250ms in AWDS) has no local
   equivalent token — Founder's closest is --transition, but that bundles a
   cubic-bezier curve into the same variable, which would silently override
   Brand's explicit "ease" easing here. Hardcoded to 220ms (Founder's actual
   motion duration value) with a literal `ease` keyword instead.

   Primary text color is Brand OS's literal choice, var(--aw-background) —
   translated to Founder's --bg. That's *not* the same token Founder's own
   .btn-primary uses for this (--aw-text-on-primary / #1A1206, the specific
   value AWDS's contrast fix was measured against) — --bg happens to pass
   WCAG AA against orange too (it's darker, not lighter), so it isn't a
   contrast bug, just a different-but-still-valid choice than the rest of
   this app makes for the same role. Flagging the inconsistency rather than
   silently "fixing" it, since matching Brand OS exactly was the ask. */
.btn--primary, .btn--secondary{
  min-height: 44px;
  padding: var(--space-4) var(--space-6); /* = AWDS --aw-space-2 / --aw-space-4 */
  border-radius: var(--radius-button);
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 600;
  border: 1px solid transparent;
  transition: background-color 220ms ease, color 220ms ease, filter 220ms ease, transform 220ms ease;
}
.btn--primary{
  background-color: var(--amber);
  color: var(--bg); /* Brand OS's literal choice — see comment above */
}
.btn--primary:hover{
  background-color: #EF9E27; /* AWDS --aw-primary-hover, exact value — this app's own
    .btn-primary:hover elsewhere uses a different hand-picked #F2AF4D; kept separate
    here to match Brand OS exactly, per direction, rather than reconciling the two. */
  transform: translateY(-2px);
}
.btn--primary:active{ transform: translateY(0); filter: brightness(0.95); }
.btn--secondary{
  background-color: transparent;
  border-color: var(--amber);
  color: var(--amber);
}
.btn--secondary:hover{ background-color: var(--amber); color: var(--text-primary); }

/* ---- Focus block ---- */
.focus-empty, .empty-state{
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: var(--space-6) var(--space-3); color: var(--text-tertiary); gap: var(--space-3);
}
.empty-icon{
  width: 46px; height: 46px; border-radius: 13px; background: rgba(255,255,255,0.04);
  display: flex; align-items: center; justify-content: center; color: var(--text-tertiary);
}
.empty-icon svg{ width: 20px; height: 20px; }
.note-pin-flag{ display: inline-flex; color: var(--amber); }
.note-pin-flag svg{ width: 13px; height: 13px; }
.empty-title{ font-size: 13.5px; font-weight: 600; color: var(--text-secondary); }
.empty-desc{ font-size: 12.5px; max-width: 260px; line-height: 1.5; }

.focus-active{ display: flex; flex-direction: column; gap: var(--space-3); }
.focus-mission-name{ font-size: 15px; font-weight: 650; }
.focus-task-name{ font-size: 12.5px; color: var(--text-secondary); }
.focus-timer{ font-family: var(--font-mono); font-size: 30px; font-weight: 600; letter-spacing: -0.02em; color: var(--amber); margin: var(--space-2) 0; }

/* ---- Metric ring (Momentum) ---- */
.metric-wrap{ display: flex; align-items: center; gap: var(--space-5); }
.ring{ position: relative; width: 96px; height: 96px; flex-shrink: 0; }
.ring svg{ width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-value{
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 21px; font-weight: 650; color: var(--text-primary);
}
.metric-breakdown{ display: flex; flex-direction: column; gap: var(--space-2); flex: 1; min-width: 0; }
.metric-row{ display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
.metric-row-label{ color: var(--text-secondary); }
.metric-row-value{ font-family: var(--font-mono); color: var(--text-primary); font-weight: 600; }

/* ---- Recovery ---- */
.recovery-status{ display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-4); }
.recovery-badge{
  width: 54px; height: 54px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-family: var(--font-mono);
  font-weight: 650; font-size: 16px; border: 2px solid var(--green); color: var(--green);
}
.recovery-badge.medium{ border-color: var(--amber); color: var(--amber); }
.recovery-badge.low{ border-color: var(--red); color: var(--red); }
.recovery-label{ font-size: 13.5px; font-weight: 600; }
.recovery-sub{ font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
.stat-line{ display: flex; justify-content: space-between; font-size: 12px; padding: 7px 0; border-top: 1px solid var(--panel-border); }
.stat-line:first-of-type{ border-top: none; }
.stat-line-label{ color: var(--text-tertiary); }
.stat-line-value{ font-family: var(--font-mono); color: var(--text-secondary); }

/* ---- Agency Health ---- */
.health-row{ display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--panel-border); }
.health-row:last-child{ border-bottom: none; }
.health-name{ font-size: 13px; font-weight: 500; }
.status-pill{
  font-family: var(--font-mono); font-size: 10px; padding: 4px 9px; border-radius: 999px; letter-spacing: 0.03em; text-transform: uppercase;
  display: flex; align-items: center; gap: 5px;
}
.status-pill.ontrack{ background: var(--green-dim); color: var(--green); }
.status-pill.attention{ background: var(--amber-dim); color: var(--amber); }
.status-pill.atrisk{ background: var(--red-dim); color: var(--red); }
.status-dot{ width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

/* ---- Activity ---- */
.activity-row{ display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--panel-border); }
.activity-row:last-child{ border-bottom: none; }
.activity-dot{ width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
.activity-text{ font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
.activity-text b{ color: var(--text-primary); font-weight: 600; }
.activity-time{ font-family: var(--font-mono); font-size: 10.5px; color: var(--text-tertiary); margin-top: 3px; }

/* ==========================================================================
   SETTINGS
   ========================================================================== */
.settings-section{ margin-bottom: var(--space-6); }
.settings-row{
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
  padding: var(--space-4) 0; border-bottom: 1px solid var(--panel-border);
}
.settings-row:last-child{ border-bottom: none; }
.settings-row-label{ font-size: 13.5px; font-weight: 600; }
.settings-row-desc{ font-size: 12px; color: var(--text-tertiary); margin-top: 3px; max-width: 420px; }
.toggle{
  width: 40px; height: 23px; border-radius: 999px; background: rgba(255,255,255,0.08);
  border: 1px solid var(--panel-border); position: relative; cursor: pointer; flex-shrink: 0; transition: background var(--transition);
}
.toggle.on{ background: var(--amber-dim); border-color: var(--amber-line); }
.toggle-knob{
  position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%;
  background: var(--text-tertiary); transition: transform var(--transition), background var(--transition);
}
.toggle.on .toggle-knob{ transform: translateX(17px); background: var(--amber); }

.danger-zone{ border: 1px solid var(--red-dim); border-radius: var(--radius-md); padding: var(--space-4); }
.btn-danger{ border-color: rgba(232,106,106,0.4); color: var(--red); background: var(--red-dim); }
.btn-danger:hover{ background: rgba(232,106,106,0.22); }

.toast{
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  padding: 11px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500;
  background: var(--panel-solid); border: 1px solid var(--panel-border-strong); color: var(--text-primary);
  opacity: 0; pointer-events: none; transition: opacity var(--transition), transform var(--transition); z-index: 100;
  box-shadow: 0 12px 40px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 8px;
}
.toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast .dot{ width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

/* ==========================================================================
   TOOLBAR / FILTERS  (Portfolio, Projects, Missions)
   ========================================================================== */
.toolbar{ display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); flex-wrap: wrap; }
.toolbar-filters{ display: flex; gap: var(--space-2); flex-wrap: wrap; }
.filter-select{
  padding: 7px 30px 7px 12px; border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 500;
  background: var(--panel-solid) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%239099AC" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>') no-repeat right 9px center / 13px 13px;
  border: 1px solid var(--panel-border-strong); color: var(--text-primary); cursor: pointer; appearance: none; -webkit-appearance: none;
}
.breadcrumbs{ display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-tertiary); margin-bottom: var(--space-4); flex-wrap: wrap; }
.breadcrumbs button{ background: none; border: none; color: var(--text-tertiary); cursor: pointer; font-size: 12.5px; padding: 2px 4px; border-radius: 6px; }
.breadcrumbs button:hover{ color: var(--text-primary); background: rgba(255,255,255,0.05); }
.breadcrumbs .crumb-current{ color: var(--text-primary); font-weight: 600; }

/* ---- Portfolio business cards ---- */
.biz-card{
  border-radius: var(--radius-md); padding: var(--space-5); cursor: pointer; /* AWDS Card radius, corrected in retheme v1.2 */
  transition: transform var(--transition), border-color var(--transition);
  display: flex; flex-direction: column; gap: var(--space-3);
}
.biz-card:hover{ transform: translateY(-2px); border-color: var(--panel-border-strong); }
.biz-card-top{ display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-2); }
.biz-card-name{ font-family: var(--font-display); font-size: 15.5px; font-weight: 650; }
.biz-card-stats{ display: flex; gap: var(--space-5); margin-top: var(--space-1); }
.biz-stat{ display: flex; flex-direction: column; }
.biz-stat-value{ font-family: var(--font-mono); font-size: 17px; font-weight: 650; }
.biz-stat-label{ font-size: 10.5px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 1px; }
.card-menu-btn{ width: 28px; height: 28px; border-radius: 8px; background: transparent; border: none; color: var(--text-tertiary); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.card-menu-btn:hover{ background: rgba(255,255,255,0.06); color: var(--text-primary); }

/* ---- Project rows / cards ---- */
.project-card{
  border-radius: var(--radius-md); padding: var(--space-4) var(--space-5);
  display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-3);
}
.project-card:last-child{ margin-bottom: 0; }
.project-main{ flex: 1; min-width: 0; }
.project-name{ font-size: 14px; font-weight: 650; margin-bottom: 2px; }
.project-sub{ font-size: 12px; color: var(--text-tertiary); }
.project-side{ display: flex; align-items: center; gap: var(--space-3); flex-shrink: 0; }
.project-progress-mini{ width: 90px; }

/* ---- Mission cards (full CRUD list) ---- */
.mission-card{ border-radius: var(--radius-md); padding: var(--space-4) var(--space-5); margin-bottom: var(--space-3); }
.mission-card:last-child{ margin-bottom: 0; }
.mission-card-top{ display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); }
.mission-card-actions{ display: flex; gap: 6px; flex-shrink: 0; }
.mission-expand-toggle{ background: none; border: none; color: var(--text-tertiary); cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 12px; padding: 4px 8px; border-radius: 6px; }
.mission-expand-toggle:hover{ color: var(--text-primary); background: rgba(255,255,255,0.05); }
.mission-expand-toggle svg{ width: 13px; height: 13px; transition: transform var(--transition); }
.mission-expand-toggle.open svg{ transform: rotate(90deg); }

.task-list{ margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--panel-border); display: flex; flex-direction: column; gap: 8px; }
.task-row{ display: flex; align-items: center; gap: var(--space-3); }
.task-check{
  width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--panel-border-strong); flex-shrink: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: background var(--transition), border-color var(--transition);
}
.task-check.done{ background: var(--green); border-color: var(--green); }
.task-check svg{ width: 11px; height: 11px; color: #121212; opacity: 0; }
.task-check.done svg{ opacity: 1; }
.task-title{ font-size: 13px; flex: 1; }
.task-title.done{ color: var(--text-tertiary); text-decoration: line-through; }
.task-remove{ background: none; border: none; color: var(--text-tertiary); cursor: pointer; opacity: 0; width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink:0; }
.task-row:hover .task-remove{ opacity: 1; }
.task-remove:hover{ color: var(--red); background: var(--red-dim); }
.task-add-row{ display: flex; gap: 8px; margin-top: 4px; }
.task-add-input{ flex: 1; }

/* ==========================================================================
   MODAL / FORMS
   ========================================================================== */
.modal-backdrop{
  position: fixed; inset: 0; background: rgba(5,7,11,0.6); backdrop-filter: blur(3px);
  display: none; align-items: center; justify-content: center; z-index: 200; padding: var(--space-4);
}
.modal-backdrop.show{ display: flex; }
.modal{
  width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto;
  background: var(--panel-solid); border: 1px solid var(--panel-border-strong); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-modal); /* AWDS Section 7 — modals get the optional glow, other surfaces use tone alone */
  padding: var(--space-5); animation: modalIn 200ms cubic-bezier(.4,0,.2,1) both;
}
@keyframes modalIn{ from{ opacity: 0; transform: translateY(10px) scale(0.98); } to{ opacity: 1; transform: translateY(0) scale(1); } }
.modal-header{ display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); }
.modal-title{ font-family: var(--font-display); font-size: 16px; font-weight: 650; }
.modal-close{ background: none; border: none; color: var(--text-tertiary); cursor: pointer; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

/* Native <select> dropdown popups (Mission status, Project status, Priority,

   <option> in the app) were invisible until hovered: .field-select/.filter-

   the popup list itself is a separate native-chrome surface that doesn't
   inherit the select's own `background` — so it fell back to the browser's
   default white, giving white-on-white text everywhere except the
   momentarily-highlighted row. Setting background-color/color directly on
   <option> (not just inherited) fixes this in Chrome/Firefox/Edge, which are
   what this offline file:// app targets; Safari's native select popups
   largely ignore option styling regardless of what CSS is set, which is a
   known platform limitation rather than something fixable from here. */
option{ background-color: var(--panel-solid); color: var(--text-primary); }

  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%239099AC" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>');
  background-repeat: no-repeat; background-position: right 12px center; background-size: 13px 13px; padding-right: 32px;
}

   ========================================================================== */

.onboarding-shell{

/* ==========================================================================
   SPLASH SCREEN (app launch)
   Plays once per real page load — gated by the in-memory splashShownThisLoad
   flag, see initApp()/renderApp() — never on in-app navigation.
   Timing/easing/offsets below are lifted directly from the live Brand OS
   splash (already tuned once after user feedback that an earlier version
   felt too fast) so the two products feel like one family on launch:
     0-750ms      AW mark fades/scales in at center
     750-1350ms   hold, AW mark alone
     1350-1950ms  AW mark shrinks to 70% and shifts up 60px, FOUNDEROS
                  wordmark fades in below it to complete the lockup
     1950-2550ms  hold, full lockup visible
     2550ms+      whole splash fades out
   Brand OS's own splash keeps going from here into welcome text + a
   Continue button, baked into the same screen. Founder OS deliberately
   does NOT reproduce that part: this app already has a real choice screen
   right after (renderOnboardingWelcome, two buttons) — adding a second
   welcome moment on top of the splash would be a redundant screen, not a
   matched one. So instead of an intro fade-in, this fades the whole splash
   out (400ms) once the lockup hold ends, straight into that existing
   screen. Total on-screen time is 2950ms.
   splashMarkIn's own duration/percentages (1950ms; 38.46%/69.23%/100%) and
   splashWordIn's (600ms, delayed 1350ms) are the literal Brand OS numbers —
   do not shorten them. Only splashOverlayOut's delay/duration are a
   Founder-specific addition on top.
   ========================================================================== */
.splash-shell{
  position: fixed; inset: 0; z-index: 500;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  animation: splashOverlayOut 400ms ease both;
  animation-delay: 2550ms;
}
.splash-stage{ position: relative; width: 100%; max-width: 480px; height: 140px; }
.splash-mark{
  position: absolute; left: 50%; top: 50%;
  width: 180px; height: auto;
  transform: translate(-50%, -50%) scale(0.9);
  opacity: 0;
  animation: splashMarkIn 1950ms ease forwards;
}
.splash-word{
  position: absolute; left: 50%; top: 50%;
  width: 240px; height: auto;
  transform: translate(-50%, calc(-50% + 14px));
  opacity: 0;
  animation: splashWordIn 600ms ease forwards;
  animation-delay: 1350ms;
}
@keyframes splashMarkIn{
  0%{     opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
  38.46%{ opacity: 1; transform: translate(-50%, -50%) scale(1); }                    /* 750ms: fade/scale-in done */
  69.23%{ opacity: 1; transform: translate(-50%, -50%) scale(1); }                    /* 1350ms: hold ends */
  100%{   opacity: 1; transform: translate(-50%, calc(-50% - 60px)) scale(0.7); }     /* 1950ms: shrink+shift done */
}
@keyframes splashWordIn{
  from{ opacity: 0; }
  to{   opacity: 1; }
}
@keyframes splashOverlayOut{
  from{ opacity: 1; visibility: visible; }
  to{   opacity: 0; visibility: hidden; }
}
/* Reduced motion: the global rule near the top of this file collapses every
   animation to ~0ms, which would make this snap straight to the end state
   with no fade at all. Brand OS's spec calls for a visible simple fade
   instead of the staged sequence — not a snap — so these more specific,
   still-!important rules intentionally take precedence over the universal
   one for just these elements. End-state transforms match the same 60px /
   scale(0.7) / +14px numbers as the full sequence above. */
@media (prefers-reduced-motion: reduce){
  .splash-mark{
    animation: splashSimpleFade 220ms ease both !important;
    transform: translate(-50%, calc(-50% - 60px)) scale(0.7);
  }
  .splash-word{
    animation: splashSimpleFade 220ms ease both !important;
    transform: translate(-50%, calc(-50% + 14px));
  }
  .splash-shell{
    animation: splashOverlayOut 220ms ease both !important;
    animation-delay: 500ms !important;
  }
}
@keyframes splashSimpleFade{
  from{ opacity: 0; }
  to{   opacity: 1; }
}

function buildTourSteps(){
  const steps = [];
  NAV_ITEMS.filter(i => i.built).forEach(item => {
    const subSteps = TOUR_CONTENT[item.id] || [{ title: item.label, blurb: "" }];
    subSteps.forEach(s => steps.push({ viewId: item.id, screenLabel: item.label, title: s.title, blurb: s.blurb, target: s.target || null }));
  });
  return steps;
}

/* ==========================================================================

   Single source of truth in memory, persisted to LocalStorage on every
   mutation. Falls back to fresh sample data if storage is missing, unreadable
   or corrupted — the app must never show a blank page.
   ========================================================================== */
let STATE = null;

// In-memory only — deliberately NOT part of STATE/localStorage. Starts false
// on every fresh script evaluation, i.e. every real browser load/reload, and
// flips true once the boot splash finishes for the lifetime of that page.
// In-app re-renders (navigateTo(), etc.) all go through renderApp() too, but
// none of them re-evaluate this script, so they see it already true and
// never re-trigger the splash — only an actual reload resets it.
let splashShownThisLoad = false;

// Also in-memory only, same reasoning as splashShownThisLoad: dismissing the
// demo banner hides it for the rest of this page load, but a fresh reload
// (or the demo simply still being active later) shows it again as a
// reminder rather than hiding it permanently — the underlying "this is fake
// data" fact doesn't go away just because someone dismissed a tooltip once.
let demoBannerDismissed = false;

function saveState(){
  try{
    recalcMetrics(STATE);
    STATE.meta.lastOpenedAt = Date.now();
    localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(STATE));
  }catch(err){
    console.error("Founder OS: failed to save state", err);
    showToast("Couldn't save — storage may be full", "warn");
  }
}

function loadState(){
  let raw;
  try{
    raw = localStorage.getItem(CONFIG.STORAGE_KEY);
    // One-time migration: anyone with data saved under the old
    // "Founder OS" key name should not appear to lose it just
    // because the product was renamed to Founder OS.
    if(!raw){
      const legacy = localStorage.getItem("founderOS.state.v1");
      if(legacy){
        raw = legacy;
        localStorage.setItem(CONFIG.STORAGE_KEY, legacy);
        localStorage.removeItem("founderOS.state.v1");
      }
    }
  }catch(err){
    console.error("Founder OS: localStorage unavailable", err);
    return null;
  }
  if(!raw) return null;
  try{
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== "object" || !Array.isArray(parsed.businesses)){
      throw new Error("Malformed state shape");
    }
    // Merge with defaults so missing keys from older schemas don't crash newer UI.
    const merged = Object.assign(getDefaultState(), parsed, {
      ui: Object.assign(defaultUiState(), parsed.ui || {}),
      projects: Array.isArray(parsed.projects) ? parsed.projects : [],
      focusSessions: Array.isArray(parsed.focusSessions) ? parsed.focusSessions : [],
      breaks: Array.isArray(parsed.breaks) ? parsed.breaks : [],
      opportunities: Array.isArray(parsed.opportunities) ? parsed.opportunities : [],
      ideas: Array.isArray(parsed.ideas) ? parsed.ideas : [],
      journalEntries: Array.isArray(parsed.journalEntries) ? parsed.journalEntries : [],
      feedback: Array.isArray(parsed.feedback) ? parsed.feedback : [],
      contacts: Array.isArray(parsed.contacts) ? parsed.contacts : [],
      communications: Array.isArray(parsed.communications) ? parsed.communications : [],
      notes: Array.isArray(parsed.notes) ? parsed.notes : [],
      meta: Object.assign({ firstLaunchAt: Date.now(), lastOpenedAt: Date.now(), onboardingComplete: false, startedFromDemo: false, tourActive: false, tourStepIndex: 0 }, parsed.meta || {}),
    });
    return migrateState(merged);
  }catch(err){
    console.error("Founder OS: corrupted state, resetting", err);
    return null;
  }
}

// Migrates older saved data forward without ever discarding it. Runs on every
// load; each step is a no-op once the migration it performs has already run.
function migrateState(state){
  // v1 -> v2: introduce Projects as a layer between Business and Mission.
  // Any mission that predates Projects gets filed under a generated
  // "General" project for its business, so no historical data is lost.
  if(state.schemaVersion < 2){
    state.businesses.forEach(biz => {
      const hasProject = state.projects.some(p => p.businessId === biz.id);
      if(!hasProject){
        const generalProject = ProjectModel({ businessId: biz.id, name: "General", status: "active" });
        state.projects.push(generalProject);
      }
    });
    state.missions.forEach(m => {
      if(!m.projectId){
        const fallback = state.projects.find(p => p.businessId === m.businessId);
        m.projectId = fallback ? fallback.id : null;
      }
    });
    state.schemaVersion = 2;
  }
  // v2 -> v3: introduce deep work tracking (timeSpentMinutes on missions,
  // focusSessions/breaks history). Existing missions simply start at 0
  // minutes spent — their progress bars and tasks are untouched.
  if(state.schemaVersion < 3){
    state.missions.forEach(m => {
      if(typeof m.timeSpentMinutes !== "number") m.timeSpentMinutes = 0;
    });
    if(!Array.isArray(state.focusSessions)) state.focusSessions = [];
    if(!Array.isArray(state.breaks)) state.breaks = [];
    if(state.activeBreak === undefined) state.activeBreak = null;
    state.schemaVersion = 3;
  }
  // v3 -> v4: Founder Intelligence. Adds Opportunities/Idea Vault/Journal,
  // and upgrades Season objectives from plain strings to checkable items.
  if(state.schemaVersion < 4){
    if(!Array.isArray(state.opportunities)) state.opportunities = [];
    if(!Array.isArray(state.ideas)) state.ideas = [];
    if(!Array.isArray(state.journalEntries)) state.journalEntries = [];
    if(state.season && Array.isArray(state.season.objectives)){
      state.season.objectives = state.season.objectives.map(o =>
        typeof o === "string" ? ObjectiveModel({ text: o }) : o
      );
    }
    state.schemaVersion = 4;
  }
  // v4 -> v5: Onboarding & Feedback. Existing consoles already have data, so
  // they're marked onboarded outright — the welcome/wizard flow is only ever
  // shown to a genuinely empty console. Missions gain completedAt so the CEO
  // Briefing can report "completed yesterday" for missions finished before
  // this field existed.
  if(state.schemaVersion < 5){
    if(!Array.isArray(state.feedback)) state.feedback = [];
    if(state.founder === undefined) state.founder = null;
    if(state.meta.onboardingComplete === undefined) state.meta.onboardingComplete = true;
    state.missions.forEach(m => {
      if(m.completedAt === undefined) m.completedAt = (m.status === "completed") ? m.createdAt : null;
    });
    state.schemaVersion = 5;
  }
  // v5 -> v6: Relationships & Notes. Adds Contacts, the Communication log,
  // and Founder Notes. Existing opportunities gain a contactId (null —
  // nothing to backfill it from) so they can optionally link to a contact.
  if(state.schemaVersion < 6){
    if(!Array.isArray(state.contacts)) state.contacts = [];
    if(!Array.isArray(state.communications)) state.communications = [];
    if(!Array.isArray(state.notes)) state.notes = [];
    state.opportunities.forEach(o => {
      if(o.contactId === undefined) o.contactId = null;
    });
    state.schemaVersion = 6;
  }
  // v6 -> v7: Client Workspace. Projects gain an optional clientContactId so
  // a Contact's page can roll up every project/mission tied to them in one
  // place. Nothing to backfill — pre-existing projects simply start unlinked.
  if(state.schemaVersion < 7){
    state.projects.forEach(p => {
      if(p.clientContactId === undefined) p.clientContactId = null;
    });
    state.schemaVersion = 7;
  }
  // v7 -> v8: Mission Templates. Adds a reusable-checklist layer above
  // Missions. Existing consoles get the same starter set a brand-new one
  // would (Edit Reel, Client Onboarding, Proposal, Invoice, Weekly Update)
  // so Templates isn't an empty screen the first time someone opens it —
  // seeded exactly once here, so deleting one afterwards is permanent.
  if(state.schemaVersion < 8){
    if(!Array.isArray(state.missionTemplates)) state.missionTemplates = defaultMissionTemplates();
    state.schemaVersion = 8;
  }
  // v8 -> v9: Knowledge Hub. Adds SOPs/Lessons Learned/Reference docs,
  // distinct from Notes (quick reference) and Mission Templates
  // (checklists) — this is where durable operating knowledge lives.
  if(state.schemaVersion < 9){
    if(!Array.isArray(state.knowledgeArticles)) state.knowledgeArticles = defaultKnowledgeArticles();
    if(state.ui.knowledgeFilter === undefined) state.ui.knowledgeFilter = "";
    if(state.ui.knowledgeFilterCategory === undefined) state.ui.knowledgeFilterCategory = "all";
    state.schemaVersion = 9;
  }
  // v9 -> v10: one-click Email/WhatsApp. Contacts gain email + phone so a
  // client's page can offer a real mailto:/wa.me compose link built from
  // their actual details, instead of a dead-end "add this manually" note.
  if(state.schemaVersion < 10){
    state.contacts.forEach(c => {
      if(c.email === undefined) c.email = "";
      if(c.phone === undefined) c.phone = "";
    });
    state.schemaVersion = 10;
  }
  // v10 -> v11: Content Pipeline. Adds a dedicated idea->published pipeline
  // for actual deliverables (reels, posts, videos), distinct from Missions
  // (which is where the work to produce them gets tracked day to day).
  if(state.schemaVersion < 11){
    if(!Array.isArray(state.contentItems)) state.contentItems = [];
    if(state.ui.contentFilterBusinessId === undefined) state.ui.contentFilterBusinessId = "all";
    if(state.ui.contentFilterProjectId === undefined) state.ui.contentFilterProjectId = "all";
    state.schemaVersion = 11;
  }
  // v11 -> v12: Content Calendar. Adds a month-view toggle alongside the
  // existing Pipeline view — same data, viewed by publish date instead of
  // stage. No data migration needed, just new UI state defaults.
  if(state.schemaVersion < 12){
    if(state.ui.contentViewMode === undefined) state.ui.contentViewMode = "pipeline";
    if(state.ui.contentCalendarMonthOffset === undefined) state.ui.contentCalendarMonthOffset = 0;
    state.schemaVersion = 12;
  }
  return state;
}

function exportDataAsJSON(){
  try{
    const blob = new Blob([JSON.stringify(STATE, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `founder-os-export-${dateKeyFor(Date.now())}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Export downloaded");
  }catch(err){
    console.error("Founder OS: export failed", err);
    showToast("Export failed", "warn");
  }
}

// Imports a previously exported JSON file, validating its shape the same way
// loadState() does so a malformed or unrelated file can't corrupt the app.
function importDataFromFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed !== "object" || !Array.isArray(parsed.businesses)){
        throw new Error("File doesn't look like a Founder OS export");
      }
      const merged = Object.assign(getDefaultState(), parsed, {
        ui: Object.assign(defaultUiState(), parsed.ui || {}),
        projects: Array.isArray(parsed.projects) ? parsed.projects : [],
        focusSessions: Array.isArray(parsed.focusSessions) ? parsed.focusSessions : [],
        breaks: Array.isArray(parsed.breaks) ? parsed.breaks : [],
        opportunities: Array.isArray(parsed.opportunities) ? parsed.opportunities : [],
        ideas: Array.isArray(parsed.ideas) ? parsed.ideas : [],
        journalEntries: Array.isArray(parsed.journalEntries) ? parsed.journalEntries : [],
      });
      STATE = migrateState(merged);
      saveState();
      renderApp();
      showToast("Data imported successfully");
    }catch(err){
      console.error("Founder OS: import failed", err);
      showToast("That file couldn't be imported — is it a Founder OS export?", "warn");
    }
  };
  reader.onerror = () => showToast("Couldn't read that file", "warn");
  reader.readAsText(file);
}

/* ==========================================================================
   SECTION: UTILITIES
   ========================================================================== */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

// Local-time YYYY-MM-DD, used as the natural one-per-day id for Journal entries.
function dateKeyFor(ts){
  const d = new Date(ts);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function formatDateLabel(dateKey){
  const [y, m, d] = dateKey.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  return date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

// For a future (or past-due) timestamp, e.g. a follow-up date.
function relativeFutureLabel(ts){
  const days = Math.round((ts - Date.now()) / (1000 * 60 * 60 * 24));
  if(days === 0) return "today";
  if(days < 0) return `${Math.abs(days)}d overdue`;
  return `in ${days}d`;
}

function timeAgo(ts){
  const diff = Math.max(0, Date.now() - ts);
  const m = Math.floor(diff / 60000);
  if(m < 1) return "just now";
  if(m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if(h < 24) return h + "h ago";
  const d = Math.floor(h / 24);
  return d + "d ago";
}

function formatMinutes(min){
  if(min < 60) return min + "m";
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `${h}h ${m}m` : `${h}h`;
}

function formatDuration(ms){
  const totalSec = Math.floor(ms / 1000);
  const h = String(Math.floor(totalSec / 3600)).padStart(2, "0");
  const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
  const sec = String(totalSec % 60).padStart(2, "0");
  return `${h}:${m}:${sec}`;
}

function projectById(id){

// Days since a business last had a focus session — Infinity if it's never
// had one at all. Used to surface the CEO Briefing's "biggest risk" line.
function daysSinceLastFocus(businessId){
  const sessions = STATE.focusSessions.filter(f => {
    const m = STATE.missions.find(mm => mm.id === f.missionId);
    return m && m.businessId === businessId;
  });
  if(!sessions.length) return Infinity;
  const mostRecent = Math.max(...sessions.map(f => f.endedAt));
  return Math.floor((Date.now() - mostRecent) / (1000 * 60 * 60 * 24));
}

function dayOfSeason(season){

/* ==========================================================================
   SECTION: CRUD OPERATIONS
   Every mutation goes through one of these functions so state stays
   consistent, gets persisted, and produces an activity log entry. Views
   never touch STATE arrays directly.
   ========================================================================== */
function computeMissionProgress(mission){
  if(!mission.tasks.length) return mission.progress;
  const done = mission.tasks.filter(t => t.done).length;
  return Math.round((done / mission.tasks.length) * 100);
}

function isToday(ts){
  if(!ts) return false;
  const d = new Date(ts), now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
}

// Recomputes every derived number (Momentum breakdown + today's Recovery
// counters) from the raw history. Called from saveState() so the dashboard
// is never more than one mutation stale. Pure function of `state` — never
// touches the module-level STATE directly, so it's safe to run against
// sample data before STATE even exists.
function recalcMetrics(state){
  const focusToday = state.focusSessions.filter(f => isToday(f.endedAt));
  const breaksToday = state.breaks.filter(b => isToday(b.endedAt));
  const totalFocusMinutesToday = focusToday.reduce((a, f) => a + f.durationMinutes, 0);

  // Focus: today's deep-work minutes against the daily target.
  const focusScore = Math.min(100, Math.round((totalFocusMinutesToday / CONFIG.FOCUS_DAILY_TARGET_MINUTES) * 100));

  // Execution: are the missions actually queued up moving forward.
  const activeMissions = state.missions.filter(m => m.status === "active");
  const executionScore = activeMissions.length
    ? Math.round(activeMissions.reduce((a, m) => a + m.progress, 0) / activeMissions.length)
    : 0;

  // Learning: breadth of businesses touched by focus sessions in the last
  // 7 days, blended with how consistently the CEO Journal is being kept —
  // reflection is as much a part of learning as touching new work.
  const weekAgo = Date.now() - 1000 * 60 * 60 * 24 * 7;
  const recentBizIds = new Set(
    state.focusSessions
      .filter(f => f.endedAt >= weekAgo)
      .map(f => { const m = state.missions.find(mm => mm.id === f.missionId); return m ? m.businessId : null; })
      .filter(Boolean)
  );
  const breadthScore = Math.min(100, Math.round((recentBizIds.size / Math.max(1, state.businesses.length)) * 100));
  const journalDaysThisWeek = state.journalEntries.filter(e => {
    const [y, m, d] = e.dateKey.split("-").map(Number);
    return new Date(y, m - 1, d).getTime() >= weekAgo;
  }).length;
  const journalScore = Math.min(100, Math.round((journalDaysThisWeek / 7) * 100));
  const learningScore = Math.round(breadthScore * 0.5 + journalScore * 0.5);

  const momentum = Math.round(focusScore * 0.4 + executionScore * 0.4 + learningScore * 0.2);

  state.metrics = { momentum, focusScore, executionScore, learningScore };
  state.recovery.focusSessionsToday = focusToday.length;
  state.recovery.breaksToday = breaksToday.length;
}

// Recovery score is a battery: deep work drains it, breaks recharge it.
// These two are the only places the score itself changes — recalcMetrics()
// only refreshes the today-facing counters, never the score.
function applyRecoveryDrain(minutes){
  STATE.recovery.score = Math.max(0, Math.round(STATE.recovery.score - minutes * 0.15));
}
function applyRecoveryRecharge(minutes){
  STATE.recovery.score = Math.min(100, Math.round(STATE.recovery.score + minutes * 0.5));
}

function logActivity(type, text){
  STATE.activity.unshift(ActivityModel({ type, text, timestamp: Date.now() }));
  STATE.activity = STATE.activity.slice(0, 30);
}

/* ---- Focus Mode session lifecycle ---- */
function currentTaskForMission(mission){
  return mission.tasks.find(t => !t.done) || null;
}
function nextMilestoneForMission(mission, currentTask){
  if(!currentTask) return mission.tasks.length ? "All tasks complete — ready to wrap up" : "No tasks yet — this is the whole mission";
  const idx = mission.tasks.findIndex(t => t.id === currentTask.id);
  const next = mission.tasks[idx + 1];
  return next ? next.title : "Final task in this mission";
}
function liveElapsedMinutes(session){
  return (Date.now() - session.startedAt) / 60000;
}
function missionRemainingMinutes(mission, liveMinutes){
  return Math.max(0, Math.round(mission.estimatedMinutes - mission.timeSpentMinutes - (liveMinutes || 0)));
}

function startFocusSession(missionId){
  const mission = STATE.missions.find(m => m.id === missionId);
  if(!mission) return;
  const startNew = () => {
    STATE.focusSession = { missionId, startedAt: Date.now() };
    logActivity("mission", `Started a focus session on <b>${escapeHtml(mission.title)}</b>`);
    saveState();
  };
  if(STATE.focusSession && STATE.focusSession.missionId !== missionId){
    const other = STATE.missions.find(m => m.id === STATE.focusSession.missionId);
    if(confirm(`You're already focused on "${other ? other.title : "another mission"}". Pause it and start this one instead?`)){
      pauseFocusSession({ silent: true });
      startNew();
    }
    return;
  }
  if(!STATE.focusSession) startNew();
}

// Ends the active session by logging it to history and draining the
// Recovery battery. Shared by both Pause and Complete Mission.
function endFocusSession(completedMission){
  const session = STATE.focusSession;
  if(!session) return null;
  const mission = STATE.missions.find(m => m.id === session.missionId);
  const minutes = Math.max(1, Math.round(liveElapsedMinutes(session)));
  const record = FocusSessionModel({
    missionId: session.missionId, startedAt: session.startedAt, endedAt: Date.now(),
    durationMinutes: minutes, completedMission: !!completedMission,
  });
  STATE.focusSessions.unshift(record);
  if(mission) mission.timeSpentMinutes += minutes;
  applyRecoveryDrain(minutes);
  STATE.focusSession = null;
  return { session, mission, minutes };
}

function pauseFocusSession(opts){
  const result = endFocusSession(false);
  if(!result) return;
  if(!opts || !opts.silent){
    logActivity("focus", `${result.minutes}-minute focus session logged${result.mission ? " on " + escapeHtml(result.mission.title) : ""}`);
  }
  saveState();
}

function completeMissionFromFocus(){
  const result = endFocusSession(true);
  if(!result) return;
  if(result.mission){
    result.mission.status = "completed";
    result.mission.progress = 100;
    result.mission.completedAt = Date.now();
    logActivity("mission", `Completed mission <b>${escapeHtml(result.mission.title)}</b> after a ${result.minutes}-minute session`);
  }
  saveState();
}

/* ---- Recovery breaks ---- */
function startBreak(){
  if(STATE.activeBreak) return;
  STATE.activeBreak = { startedAt: Date.now() };
  saveState();
}
function endBreak(){
  const b = STATE.activeBreak;
  if(!b) return;
  const minutes = Math.max(1, Math.round((Date.now() - b.startedAt) / 60000));
  const record = BreakModel({ startedAt: b.startedAt, endedAt: Date.now(), durationMinutes: minutes });
  STATE.breaks.unshift(record);
  STATE.recovery.lastSessionAt = record.endedAt;
  applyRecoveryRecharge(minutes);
  STATE.activeBreak = null;
  logActivity("recovery", `Recovery break completed — ${minutes} minute${minutes === 1 ? "" : "s"}`);
  saveState();
}

// Both are plain compose links — no accounts, no secrets, no backend.
// mailto: opens the person's own email client; wa.me opens WhatsApp
// (desktop or mobile) with the message pre-filled, ready for a human to
// review and hit send. Neither one "sends" anything on its own.
function buildMailtoLink(contact, subject, body){
  const params = new URLSearchParams();
  if(subject) params.set("subject", subject);
  if(body) params.set("body", body);
  const qs = params.toString().replace(/\+/g, "%20"); // spaces as %20 read more reliably across mail clients than +
  return `mailto:${contact.email}${qs ? "?" + qs : ""}`;
}
function buildWhatsAppLink(contact, message){
  const digits = (contact.phone || "").replace(/[^0-9]/g, ""); // wa.me wants country code + number, digits only, no leading +
  const params = message ? `?text=${encodeURIComponent(message)}` : "";
  return `https://wa.me/${digits}${params}`;
}

/* ==========================================================================
   SECTION: MODAL SYSTEM
   A single reusable modal mount point. Callers supply inner HTML and an
   onMount callback to wire up form submission — this keeps every
   create/edit form consistent without duplicating open/close plumbing.
   ========================================================================== */
let lastFocusedBeforeModal = null;
function openModal(innerHtml, onMount){
  const backdrop = document.getElementById("modalBackdrop");
  const root = document.getElementById("modalRoot");
  lastFocusedBeforeModal = document.activeElement;
  root.innerHTML = innerHtml;
  backdrop.classList.add("show");
  enhanceAccessibility(root);
  if(typeof onMount === "function") onMount(root);
  root.querySelectorAll("[data-modal-close]").forEach(btn => btn.addEventListener("click", closeModal));
}
function closeModal(){
  document.getElementById("modalBackdrop").classList.remove("show");
  document.getElementById("modalRoot").innerHTML = "";
  if(lastFocusedBeforeModal && typeof lastFocusedBeforeModal.focus === "function"){
    lastFocusedBeforeModal.focus();
  }
  lastFocusedBeforeModal = null;
}
document.getElementById("modalBackdrop").addEventListener("click", (e) => {
  if(e.target.id === "modalBackdrop") closeModal();
});
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape") closeModal();
});

// Custom clickable elements (divs/spans with data-action, used for cards and
// checkboxes) get keyboard focus + Enter/Space activation and an aria-label
// mirrored from their title, without having to touch every template that
// renders one.
function enhanceAccessibility(root){
  root.querySelectorAll("[title]:not([aria-label])").forEach(el => {
    el.setAttribute("aria-label", el.getAttribute("title"));
  });
  root.querySelectorAll("[data-action]").forEach(el => {
    const tag = el.tagName;
    if(tag !== "BUTTON" && tag !== "SELECT" && tag !== "INPUT" && tag !== "A" && tag !== "TEXTAREA"){
      if(!el.hasAttribute("tabindex")) el.setAttribute("tabindex", "0");
      if(!el.hasAttribute("role")) el.setAttribute("role", "button");
    }
  });
}
// One global listener handles Enter/Space activation for every such element,
// present or future — no per-render rebinding needed.
document.addEventListener("keydown", (e) => {
  if((e.key === "Enter" || e.key === " ") && e.target && e.target.getAttribute && e.target.getAttribute("role") === "button" && e.target.tagName !== "BUTTON"){
    e.preventDefault();
    e.target.click();
  }
});

/* ==========================================================================
   SECTION: UI COMPONENTS — shared fragments
   ========================================================================== */
function statusPill(status){
  const map = {
    ontrack:   { label: "On Track",        cls: "ontrack" },
    attention: { label: "Needs Attention", cls: "attention" },
    atrisk:    { label: "At Risk",         cls: "atrisk" },
    // Project statuses share the same visual language.
    active:    { label: "Active",          cls: "ontrack" },
    onhold:    { label: "On Hold",         cls: "attention" },
    completed: { label: "Completed",       cls: "ontrack" },
  };
  const s = map[status] || map.ontrack;
  return `<span class="status-pill ${s.cls}"><span class="status-dot"></span>${s.label}</span>`;
}

function priorityTag(priority){
  const map = { high: "tag-priority-high", medium: "tag-priority-med", low: "tag-priority-low" };
  return `<span class="tag ${map[priority] || map.medium}">${priority.toUpperCase()}</span>`;
}

function ringSvg(percent, size, colorVar){
  const r = (size - 10) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (percent / 100) * c;
  return `<svg viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="8"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${colorVar}" stroke-width="8"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
      style="transition: stroke-dashoffset 700ms cubic-bezier(.4,0,.2,1)"/>
  </svg>`;
}
