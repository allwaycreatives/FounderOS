function renderCEOBriefing(){
  const season = STATE.season;
  const topMission = STATE.missions
    .filter(m => m.status === "active")
    .sort((a, b) => b.impactScore - a.impactScore)[0] || null;
  const day = season ? dayOfSeason(season) : 0;
  const total = season ? seasonDaysTotal(season) : 0;

  const missionPart = topMission
    ? `Your highest-leverage move right now is <b>${escapeHtml(topMission.title)}</b> — it's already ${topMission.progress}% there.`
    : `You have no active mission queued — open Missions to start one.`;

  const objectives = season ? season.objectives : [];
  const objectivesRemaining = objectives.filter(o => !o.done).length;
  const objectivesPart = season && objectives.length
    ? ` <b>${objectives.length - objectivesRemaining} of ${objectives.length}</b> season objectives are done.`
    : "";

  const inboxCount = STATE.ideas.filter(i => i.status === "inbox").length;
  const ideaPart = inboxCount > 0
    ? ` ${inboxCount} idea${inboxCount === 1 ? "" : "s"} ${inboxCount === 1 ? "is" : "are"} waiting in your vault when you're ready.`
    : "";

  const recoveryPart = STATE.recovery.score < 40
    ? ` Your recovery battery is low (${STATE.recovery.score}) — consider a short break before diving into deep work.`
    : " Protect one deep-work block today and let everything else wait.";

  const yesterdayKey = dateKeyFor(Date.now() - 1000 * 60 * 60 * 24);
  const completedYesterday = missionsCompletedOnDate(yesterdayKey);
  const yesterdayPart = completedYesterday > 0
    ? ` Yesterday you completed ${completedYesterday} mission${completedYesterday === 1 ? "" : "s"}.`
    : "";

  const businessesWithMissions = STATE.businesses.filter(b => missionsForBusiness(b.id).length > 0);
  let riskPart = "";
  if(businessesWithMissions.length){
    const riskiest = businessesWithMissions
      .map(b => ({ b, quiet: daysSinceLastFocus(b.id) }))
      .sort((a, c) => c.quiet - a.quiet)[0];
    if(riskiest && riskiest.quiet >= 4 && riskiest.quiet !== Infinity){
      riskPart = ` Biggest risk: <b>${escapeHtml(riskiest.b.name)}</b> hasn't had a focus session in ${riskiest.quiet} days.`;
    }else if(riskiest && riskiest.quiet === Infinity){
      riskPart = ` Biggest risk: <b>${escapeHtml(riskiest.b.name)}</b> hasn't had a focus session yet.`;
    }
  }

  return `
  <div class="hud col-12" data-tour="ceo-briefing">
    <div class="hud-icon">${icon("radio")}</div>
    <div class="hud-body">
      <div class="hud-label">Daily CEO Briefing</div>
      <div class="hud-text">
        ${season ? `Day <b>${day}</b> of <b>${total}</b> in the <b>${escapeHtml(season.name)}</b> season.` : ""}
        ${objectivesPart}
        ${yesterdayPart}
        ${missionPart}${recoveryPart}${ideaPart}${riskPart}
      </div>
    </div>
  </div>`;
}

// Phase 7: plain-language recipes for the three flagship "How this got
// here" cards. Each string mirrors the actual field labels and entry point
// from the real creation form for that entity (openMissionModal(),
// openProjectModal(), openOpportunityModal()) — kept in sync by hand since
// there's no introspection of the form markup itself, so if a form's fields
// ever change, this needs a matching edit.
const CARD_RECIPES = {
  mission: "Missions &rarr; New mission &rarr; filled in Mission title, Project, Priority, Status, Estimated time (minutes), and Impact score.",
  project: "Projects &rarr; New project &rarr; filled in Project name, Business, Status, and Description.",
  opportunity: "Opportunities &rarr; New opportunity &rarr; filled in Name, Business, Stage, Contact (optional), Estimated value (optional), and Notes.",
};

// Static, non-animated by design (Phase 7) — a native <details>/<summary>
// so expand/collapse needs zero JS state of its own (no STATE field, no
// re-render just to toggle it). Only ever shown on demo data — hidden
// entirely once startedFromDemo is false, since there's nothing to explain
// on a founder's real, self-entered console.
function renderRecipeAffordance(kind){
  if(!STATE.meta.startedFromDemo) return "";
  const recipe = CARD_RECIPES[kind];
  if(!recipe) return "";
  return `
  <details class="recipe-affordance">
    <summary>${icon("help")}How this got here</summary>
    <div class="recipe-body">This came from: ${recipe}</div>
  </details>`;
}

function emptyState(iconName, title, desc){
  return `<div class="empty-state">

}

      const mission = createMissionFromTemplate(template, projectId);

      STATE.ui.currentView = "missions";

      STATE.ui.missionsFilterBusinessId = mission.businessId;

function bindTemplateEvents(){
  document.querySelectorAll('[data-action="new-template"]').forEach(btn => {
    btn.addEventListener("click", () => openTemplateModal(null));
  });
  document.querySelectorAll('[data-action="edit-template"]').forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      openTemplateModal(missionTemplateById(btn.getAttribute("data-id")));
    });
  });
  document.querySelectorAll('[data-action="delete-template"]').forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = btn.getAttribute("data-id");
      const tmpl = missionTemplateById(id);
      confirmAndDelete(`Delete the "${tmpl.title}" template? Missions already created from it are untouched.`, () => deleteMissionTemplate(id));
    });
  });
  document.querySelectorAll('[data-action="use-template"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const tmpl = missionTemplateById(btn.getAttribute("data-id"));
      if(!tmpl) return;
      if(!STATE.projects.length){ showToast("Create a project first"); return; }
      openApplyTemplateModal(tmpl);
    });
  });
}

/* --------------------------------------------------------------------------
   FOCUS MODE
   Two very different renders live here: a normal-shell "picker" for when
   nothing is running, and a fullscreen distraction-free shell for when a
   session is active — the latter bypasses the sidebar/topbar entirely.
   -------------------------------------------------------------------------- */
function renderFocusPicker(){
  const activeMissions = STATE.missions.filter(m => m.status === "active").sort((a,b) => b.impactScore - a.impactScore);
  const rows = activeMissions.map(m => {
    const biz = businessById(m.businessId);
    return `
    <div class="mission-row">
      <div class="mission-main">
        <div class="mission-title">${escapeHtml(m.title)}</div>
        <div class="mission-meta">
          <span class="tag tag-biz">${escapeHtml(biz.name)}</span>
          ${priorityTag(m.priority)}
          <span class="tag tag-time">${formatMinutes(missionRemainingMinutes(m))} left</span>
        </div>
      </div>
      <button class="btn btn-primary btn-sm" data-action="start-mission" data-id="${m.id}">${icon("play")} Start</button>
    </div>`;
  }).join("");

  return `
  <div class="view-enter">
    <div class="card glass col-12">
      <h3 class="card-title"><span class="card-icon">${icon("focus")}</span>Pick a mission to enter Focus Mode</h3>
      ${rows || emptyState("focus", "No active missions to focus on", "Queue a mission first, then come back here to start a distraction-free session.")}
    </div>
  </div>`;
}

function renderFocusModeFullscreen(){
  const session = STATE.focusSession;
  const mission = STATE.missions.find(m => m.id === session.missionId);
  if(!mission){
    // Defensive: the mission was deleted mid-session elsewhere. Don't trap
    // the founder in a broken fullscreen view.
    STATE.focusSession = null;
    saveState();
    return null;
  }
  const task = currentTaskForMission(mission);
  const milestone = nextMilestoneForMission(mission, task);
  const biz = businessById(mission.businessId);
  const remainingCfg = escapeHtml(JSON.stringify({ startedAt: session.startedAt, estimatedMinutes: mission.estimatedMinutes, timeSpentMinutes: mission.timeSpentMinutes }));

  return `
  <div class="focus-shell">
    <button class="focus-exit" data-action="exit-focus-mode">${icon("close")} Exit fullscreen</button>
    <div class="focus-shell-inner">
      <div class="focus-shell-eyebrow">${escapeHtml(biz.name)} · CURRENT MISSION</div>
      <div class="focus-shell-mission">${escapeHtml(mission.title)}</div>

      <div class="focus-shell-timer" data-live-timer="${session.startedAt}">00:00:00</div>
      <div class="focus-shell-remaining" data-live-remaining='${remainingCfg}'>Calculating…</div>

      <div class="focus-shell-task-card glass">
        <div class="focus-shell-task-label">CURRENT TASK</div>
        ${task ? `
          <div class="focus-shell-task-row">
            <div class="task-check" data-action="toggle-task" data-mission="${mission.id}" data-task="${task.id}">${icon("check")}</div>
            <div class="focus-shell-task-title">${escapeHtml(task.title)}</div>
          </div>
        ` : `<div class="focus-shell-task-title" style="color:var(--text-tertiary); font-weight: 500;">No tasks left — this mission is ready to complete</div>`}
        <div class="focus-shell-milestone">NEXT MILESTONE &nbsp;·&nbsp; ${escapeHtml(milestone)}</div>
      </div>

      <div class="focus-shell-actions">
        <button class="btn btn-ghost" data-action="stop-focus">${icon("focus")} Pause</button>
        <button class="btn btn-primary" data-action="complete-mission">${icon("check")} Complete Mission</button>
      </div>
    </div>
  </div>`;
}

function renderRecoveryView(){
  const r = STATE.recovery;
  const tierColor = r.score >= 70 ? "var(--green)" : r.score >= 40 ? "var(--amber)" : "var(--red)";
  const tierNote = r.score >= 70 ? "Well recovered — good to push hard." : r.score >= 40 ? "Recovering — pace yourself today." : "Run down — a break will help before the next deep-work block.";
  const activeBreak = STATE.activeBreak;
  const todayFocusMinutes = STATE.focusSessions.filter(f => isToday(f.endedAt)).reduce((a, f) => a + f.durationMinutes, 0);

  const history = [
    ...STATE.focusSessions.map(f => ({ kind: "focus", ts: f.endedAt, minutes: f.durationMinutes, missionId: f.missionId, completedMission: f.completedMission })),
    ...STATE.breaks.map(b => ({ kind: "break", ts: b.endedAt, minutes: b.durationMinutes })),
  ].sort((a, b) => b.ts - a.ts).slice(0, 10);

  const historyRows = history.map(h => {
    if(h.kind === "break"){
      return `<div class="activity-row"><div class="activity-dot" style="background:var(--green)"></div><div><div class="activity-text">Recovery break — <b>${h.minutes} min</b></div><div class="activity-time">${timeAgo(h.ts)}</div></div></div>`;
    }
    const mission = STATE.missions.find(m => m.id === h.missionId);
    return `<div class="activity-row"><div class="activity-dot" style="background:var(--blue)"></div><div><div class="activity-text">${h.minutes}-minute focus session on <b>${escapeHtml(mission ? mission.title : "a deleted mission")}</b>${h.completedMission ? " — mission completed" : ""}</div><div class="activity-time">${timeAgo(h.ts)}</div></div></div>`;
  }).join("");

  return `
  <div class="view-enter">
    <div class="grid dash-grid">
      <div class="card glass col-4">
        <h3 class="card-title"><span class="card-icon">${icon("battery")}</span>Recovery Battery</h3>
        <div class="metric-wrap" style="justify-content:center;">
          <div class="ring" style="width:140px;height:140px;">${ringSvg(r.score, 140, tierColor)}<div class="ring-value" style="font-size:28px;">${r.score}</div></div>
        </div>
        <div style="text-align:center; margin-top:var(--space-3); font-size:12.5px; color:var(--text-tertiary); line-height:1.5;">${tierNote}</div>
      </div>

      <div class="card glass col-4">
        <h3 class="card-title"><span class="card-icon">${icon("focus")}</span>Today</h3>
        <div class="stat-line"><span class="stat-line-label">Focus sessions</span><span class="stat-line-value">${r.focusSessionsToday}</span></div>
        <div class="stat-line"><span class="stat-line-label">Deep work minutes</span><span class="stat-line-value">${todayFocusMinutes}m</span></div>
        <div class="stat-line"><span class="stat-line-label">Breaks taken</span><span class="stat-line-value">${r.breaksToday}</span></div>
        <div class="stat-line"><span class="stat-line-label">Last break</span><span class="stat-line-value">${r.lastSessionAt ? timeAgo(r.lastSessionAt) : "—"}</span></div>
      </div>

      <div class="card glass col-4">
        <h3 class="card-title"><span class="card-icon">${icon("radio")}</span>Recovery Break</h3>
        ${activeBreak ? `
          <div style="text-align:center;">
            <div class="focus-timer" data-live-timer="${activeBreak.startedAt}" style="font-size:26px;">00:00:00</div>
            <button class="btn btn-primary" data-action="end-break" style="margin-top:var(--space-3);width:100%;">${icon("check")} End Break</button>
          </div>
        ` : `
          ${emptyState("battery", "No break running", "Step away for a few minutes to recharge before your next deep-work block.")}
          <button class="btn btn-ghost" data-action="start-break" style="width:100%; margin-top:var(--space-3);">${icon("play")} Start Recovery Break</button>
        `}
      </div>

      <div class="card glass col-12">
        <h3 class="card-title"><span class="card-icon">${icon("history")}</span>Deep Work &amp; Recovery Log</h3>
        ${historyRows || emptyState("history", "No sessions logged yet", "Start a focus session or a break to begin building your log.")}
      </div>
    </div>
  </div>`;
}

/* --------------------------------------------------------------------------
   OPPORTUNITY PIPELINE
   -------------------------------------------------------------------------- */
function renderOpportunities(){
  const filterBiz = STATE.ui.opportunitiesFilterBusinessId;
  const opps = STATE.opportunities.filter(o => filterBiz === "all" || o.businessId === filterBiz);
  const bizOptions = STATE.businesses.map(b => `<option value="${b.id}" ${filterBiz === b.id ? "selected" : ""}>${escapeHtml(b.name)}</option>`).join("");

  const stageOptionsHtml = (selected) => OPPORTUNITY_STAGES.map(s =>
    `<option value="${s}" ${s === selected ? "selected" : ""}>${s[0].toUpperCase() + s.slice(1)}</option>`
  ).join("");

  let recipeShown = false;
  const sections = OPPORTUNITY_STAGES.map(stage => {
    const inStage = opps.filter(o => o.stage === stage);
    if(!inStage.length) return "";
    const cards = inStage.map(o => {
      const biz = businessById(o.businessId);
      const contact = o.contactId ? contactById(o.contactId) : null;
      const showRecipe = !recipeShown;
      recipeShown = true;
      return `
      <div class="mission-card glass">
        <div class="mission-card-top">
          <div class="mission-main">
            <div class="mission-title">${escapeHtml(o.name)}</div>
            <div class="mission-meta">
              <span class="tag tag-biz">${escapeHtml(biz.name)}</span>
              ${contact ? `<span class="tag" style="background:rgba(255,255,255,0.06);color:var(--text-secondary);">${icon("users")} ${escapeHtml(contact.name)}</span>` : ""}
            </div>
            ${o.notes ? `<div class="opportunity-notes">${escapeHtml(o.notes)}</div>` : ""}
            ${showRecipe ? renderRecipeAffordance("opportunity") : ""}
          </div>
          <div class="mission-card-actions">
            ${o.estimatedValue > 0 ? `<div class="value-block"><div class="value-amount">${o.estimatedValue.toLocaleString()}</div><div class="value-label">Est. value</div></div>` : ""}
            <select class="filter-select stage-select" data-action="move-opportunity-stage" data-id="${o.id}" ${showRecipe ? `data-tour="opportunity-stage-move"` : ""}>${stageOptionsHtml(o.stage)}</select>
            <button class="icon-btn" data-action="edit-opportunity" data-id="${o.id}" title="Edit opportunity">${icon("edit")}</button>
            <button class="icon-btn" data-action="delete-opportunity" data-id="${o.id}" title="Delete opportunity">${icon("trash")}</button>
          </div>
        </div>
      </div>`;
    }).join("");
    return `
    <div class="stage-header">${stage} <span class="stage-count">${inStage.length}</span></div>
    ${cards}`;
  }).join("");

  return `
  <div class="view-enter">
    <div class="toolbar">
      <div class="toolbar-filters">
        <select class="filter-select" data-action="filter-opportunities-business">
          <option value="all">All businesses</option>
          ${bizOptions}
        </select>
      </div>
      <button class="btn btn-primary" data-action="new-opportunity">${icon("plus")} New opportunity</button>
    </div>
    <div data-tour="opportunities-pipeline">
      ${sections || `<div class="card glass col-12">${emptyState("pipeline", "No opportunities yet", "Add the first one to start tracking it from idea through to completed.")}</div>`}
    </div>
  </div>`;
}

/* --------------------------------------------------------------------------

   to in the Opportunity Pipeline.
   -------------------------------------------------------------------------- */
function renderContacts(){
  const focusId = STATE.ui.contactFocusId;
  const focusContact = focusId ? contactById(focusId) : null;
  if(focusContact) return renderContactDetail(focusContact);

  const filterCat = STATE.ui.contactsFilterCategory;
  const contacts = STATE.contacts.filter(c => filterCat === "all" || c.category === filterCat);
  const catOptions = CONTACT_CATEGORIES.map(c => `<option value="${c}" ${filterCat === c ? "selected" : ""}>${c}</option>`).join("");

  const rows = contacts.map(c => {
    const biz = c.businessId ? businessById(c.businessId) : null;
    const overdue = c.nextFollowUpAt && c.nextFollowUpAt < Date.now();
    return `
    <div class="project-card glass card-clickable" data-action="open-contact" data-id="${c.id}">
      <div class="project-main">
        <div class="project-name">${escapeHtml(c.name)}</div>
        <div class="project-sub">${escapeHtml(c.category)}${biz ? " · " + escapeHtml(biz.name) : ""} · Last contact ${c.lastContactAt ? timeAgo(c.lastContactAt) : "never"}</div>
      </div>
      <div class="project-side">
        ${c.nextFollowUpAt ? `<span class="tag" style="background:${overdue ? "var(--red-dim)" : "var(--amber-dim)"};color:${overdue ? "var(--red)" : "var(--amber)"};">Follow-up ${escapeHtml(relativeFutureLabel(c.nextFollowUpAt))}</span>` : ""}
        <button class="icon-btn" data-action="edit-contact" data-id="${c.id}" title="Edit contact">${icon("edit")}</button>
        <button class="icon-btn" data-action="delete-contact" data-id="${c.id}" title="Delete contact">${icon("trash")}</button>
      </div>
    </div>`;
  }).join("");

  return `
  <div class="view-enter">
    <div class="toolbar">
      <div class="toolbar-filters">
        <select class="filter-select" data-action="filter-contacts-category">
          <option value="all">All categories</option>
          ${catOptions}
        </select>
      </div>
      <button class="btn btn-primary" data-action="new-contact">${icon("plus")} New contact</button>
    </div>
    <div class="card glass col-12">
      ${rows || emptyState("users", "No contacts yet", "Add the people and relationships that matter to your businesses — clients, team, partners, family.")}
    </div>
  </div>`;
}

function renderContactDetail(contact){
  const biz = contact.businessId ? businessById(contact.businessId) : null;
  const comms = communicationsForContact(contact.id);
  const linkedOpps = opportunitiesForContact(contact.id);
  const overdue = contact.nextFollowUpAt && contact.nextFollowUpAt < Date.now();

  const commRows = comms.map(c => {
    const typeLabel = (COMMUNICATION_TYPES.find(t => t.value === c.type) || {}).label || c.type;
    return `
    <div class="activity-row">
      <div class="activity-dot" style="background:var(--blue)"></div>
      <div style="flex:1;">
        <div class="activity-text"><b>${escapeHtml(typeLabel)}</b> — ${escapeHtml(c.summary)}</div>
        <div class="activity-time">${timeAgo(c.occurredAt)}</div>
      </div>
      <button class="icon-btn" data-action="delete-communication" data-id="${c.id}" title="Delete entry">${icon("close")}</button>
    </div>`;
  }).join("");

  const oppRows = linkedOpps.map(o => `
    <div class="idea-row">
      <div class="idea-text">${escapeHtml(o.name)}</div>
      <div class="idea-meta-row"><span class="tag" style="background:rgba(255,255,255,0.06);color:var(--text-secondary);">${escapeHtml(o.stage)}</span></div>
    </div>`).join("");

  // Client Workspace rollup: every project linked to this contact, with its
  // live mission progress — the "everything about this client in one place" view.
  const clientProjects = projectsForContact(contact.id);
  const clientProjectRows = clientProjects.map(p => {
    const missions = missionsForProject(p.id);
    const activeMissions = missions.filter(m => m.status === "active");
    const completedMissions = missions.filter(m => m.status === "completed");
    const avgProgress = missions.length ? Math.round(missions.reduce((a, m) => a + m.progress, 0) / missions.length) : 0;
    return `
    <div class="project-card glass card-clickable" data-action="open-client-project" data-id="${p.id}">
      <div class="project-main">
        <div class="project-name">${escapeHtml(p.name)}</div>
        <div class="project-sub">${activeMissions.length} active · ${completedMissions.length} completed · ${missions.length} total mission${missions.length === 1 ? "" : "s"}</div>
      </div>
      <div class="project-side">
        ${statusPill(p.status)}
        <div class="project-progress-mini"><div class="progress-track"><div class="progress-fill" style="width:${avgProgress}%"></div></div></div>
      </div>
    </div>`;
  }).join("");

  return `
  <div class="view-enter">
    <div class="breadcrumbs">
      <button data-action="contacts-back">Contacts</button>
      <span>/</span>
      <span class="crumb-current">${escapeHtml(contact.name)}</span>
    </div>
    <div class="toolbar">
      <div>
        <span class="tag tag-biz">${escapeHtml(contact.category)}</span>
        ${biz ? `<span class="tag" style="background:rgba(255,255,255,0.06);color:var(--text-secondary);margin-left:6px;">${escapeHtml(biz.name)}</span>` : ""}
      </div>
      <div class="toolbar-filters">
        <button class="btn btn-ghost btn-sm" data-action="edit-contact" data-id="${contact.id}">${icon("edit")} Edit</button>
        <button class="btn btn-ghost btn-sm" data-action="delete-contact" data-id="${contact.id}">${icon("trash")} Delete</button>
      </div>
    </div>

    <div class="grid dash-grid">
      <div class="card glass col-4">
        <h3 class="card-title">Last Contact</h3>
        <div style="font-size:20px;font-weight:650;">${contact.lastContactAt ? timeAgo(contact.lastContactAt) : "Never"}</div>
      </div>
      <div class="card glass col-4">
        <h3 class="card-title">Next Follow-up</h3>
        <div style="font-size:20px;font-weight:650;color:${overdue ? "var(--red)" : "var(--text-primary)"};">
          ${contact.nextFollowUpAt ? relativeFutureLabel(contact.nextFollowUpAt) : "Not scheduled"}
        </div>
        <button class="btn btn-ghost btn-sm" data-action="set-follow-up" data-id="${contact.id}" style="margin-top:var(--space-3);">${icon("edit")} ${contact.nextFollowUpAt ? "Change" : "Schedule"}</button>
      </div>
      <div class="card glass col-4">
        <h3 class="card-title">Notes</h3>
        <div style="font-size:13px;color:var(--text-secondary);line-height:1.55;">${contact.notes ? escapeHtml(contact.notes) : `<span style="color:var(--text-tertiary);">No notes yet.</span>`}</div>
      </div>

      ${contact.category === "Client" ? `
      <div class="card glass col-12">
        <h3 class="card-title"><span class="card-icon">${icon("folder")}</span>Projects &amp; Deliverables</h3>
        ${clientProjectRows || emptyState("folder", "No projects linked yet", "Create a project (or edit an existing one) and set this person as the Client to see it here.")}
        <button class="btn btn-ghost btn-sm" data-action="new-client-project" data-id="${contact.id}" style="margin-top:var(--space-3);">${icon("plus")} New project for ${escapeHtml(contact.name)}</button>
      </div>` : ""}

      <div class="card glass col-12">
        <h3 class="card-title"><span class="card-icon">${icon("send")}</span>Quick Send</h3>
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:var(--space-3);">Opens a message pre-filled and ready to review — nothing sends automatically.</div>
        <div style="display:flex;gap:var(--space-2);flex-wrap:wrap;">
          ${contact.email
            ? `<a class="btn btn-ghost btn-sm" href="${buildMailtoLink(contact, `Update from ${biz ? biz.name : "All Way Creatives"}`, `Hi ${contact.name.split(" ")[0]},\n\n`)}" target="_blank" rel="noopener">${icon("send")} Email ${escapeHtml(contact.email)}</a>`
            : `<button class="btn btn-ghost btn-sm" data-action="edit-contact" data-id="${contact.id}" title="Add an email to enable this">${icon("send")} Add email to enable</button>`}
          ${contact.phone
            ? `<a class="btn btn-ghost btn-sm" href="${buildWhatsAppLink(contact, `Hi ${contact.name.split(" ")[0]}, `)}" target="_blank" rel="noopener">${icon("send")} WhatsApp ${escapeHtml(contact.phone)}</a>`
            : `<button class="btn btn-ghost btn-sm" data-action="edit-contact" data-id="${contact.id}" title="Add a WhatsApp number to enable this">${icon("send")} Add WhatsApp to enable</button>`}
        </div>
      </div>

      <div class="card glass col-12">
        <h3 class="card-title"><span class="card-icon">${icon("send")}</span>Log a Communication</h3>
        <form id="commForm">
          <div class="field-row">
            <div class="field">
              <label class="field-label">Type</label>
              <select class="field-select" name="type">
                ${COMMUNICATION_TYPES.map(t => `<option value="${t.value}">${t.label}</option>`).join("")}
              </select>
            </div>
            <div class="field">
              <label class="field-label">When</label>
              <input class="field-input" type="date" name="occurredAt" value="${new Date().toISOString().slice(0, 10)}" />
            </div>
          </div>
          <div class="field">
            <textarea class="field-textarea" name="summary" placeholder="What happened?" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">${icon("send")} Log it</button>
        </form>
      </div>

      <div class="card glass col-12">
        <h3 class="card-title"><span class="card-icon">${icon("history")}</span>Communication History</h3>
        ${commRows || emptyState("send", "No communications logged yet", "Log your first call, meeting, or note above.")}
      </div>

      ${linkedOpps.length ? `
      <div class="card glass col-12">
        <h3 class="card-title"><span class="card-icon">${icon("pipeline")}</span>Linked Opportunities</h3>
        ${oppRows}
      </div>` : ""}
    </div>
  </div>`;
}

/* --------------------------------------------------------------------------
   IDEA VAULT
   -------------------------------------------------------------------------- */
function renderIdeaVault(){
  const tab = STATE.ui.ideaVaultTab;
  const ideas = STATE.ideas.filter(i => i.status === tab).sort((a, b) => b.createdAt - a.createdAt);
  const counts = {
    inbox: STATE.ideas.filter(i => i.status === "inbox").length,
    assigned: STATE.ideas.filter(i => i.status === "assigned").length,
    archived: STATE.ideas.filter(i => i.status === "archived").length,
  };

  const rows = ideas.map(idea => {
    const proj = idea.projectId ? projectById(idea.projectId) : null;
    let actions = "";
    if(tab === "inbox"){
      actions = `
        <button class="btn btn-ghost btn-sm" data-action="assign-idea" data-id="${idea.id}">Assign to project</button>
        <button class="icon-btn" data-action="archive-idea" data-id="${idea.id}" title="Archive">${icon("close")}</button>
        <button class="icon-btn" data-action="delete-idea" data-id="${idea.id}" title="Delete">${icon("trash")}</button>`;
    }else if(tab === "assigned"){
      actions = `
        <span class="tag" style="background:rgba(255,255,255,0.06);color:var(--text-secondary);">${proj ? escapeHtml(proj.name) : "Unknown project"}</span>
        <button class="icon-btn" data-action="unassign-idea" data-id="${idea.id}" title="Return to inbox">${icon("close")}</button>
        <button class="icon-btn" data-action="delete-idea" data-id="${idea.id}" title="Delete">${icon("trash")}</button>`;
    }else{
      actions = `
        <button class="btn btn-ghost btn-sm" data-action="restore-idea" data-id="${idea.id}">Restore</button>
        <button class="icon-btn" data-action="delete-idea" data-id="${idea.id}" title="Delete">${icon("trash")}</button>`;

  const catTagColor = (cat) => cat === "SOP" ? "var(--blue)" : cat === "Lesson Learned" ? "var(--amber)" : "var(--text-secondary)";

/* --------------------------------------------------------------------------
   COMMAND PALETTE & KEYBOARD SHORTCUTS
   Linear/Arc-style: Cmd/Ctrl+K opens a searchable list of navigation and
   quick-create actions. Destructive actions are deliberately excluded —
   this is a fast path to create and move, not to delete.
   -------------------------------------------------------------------------- */
function getCommandList(){
  const commands = [];
  NAV_ITEMS.filter(i => i.built).forEach(item => {
    commands.push({ label: `Go to ${item.label}`, hint: "Navigate", run: () => { closeModal(); navigateTo(item.id); } });
  });
  commands.push(
    { label: "New Business", hint: "Create", run: () => { closeModal(); navigateTo("portfolio"); openBusinessModal(null); } },
    { label: "New Project", hint: "Create", run: () => { closeModal(); navigateTo("projects"); openProjectModal(null); } },
    { label: "New Mission", hint: "Create", run: () => { closeModal(); navigateTo("missions"); openMissionModal(null); } },
    { label: "New Opportunity", hint: "Create", run: () => { closeModal(); navigateTo("opportunities"); openOpportunityModal(null); } },
    { label: "New Contact", hint: "Create", run: () => { closeModal(); navigateTo("contacts"); openContactModal(null); } },
    { label: "New Note", hint: "Create", run: () => { closeModal(); navigateTo("notes"); openNoteModal(null); } },
    { label: "Capture an Idea", hint: "Create", run: () => { closeModal(); openIdeaQuickCaptureModal(); } },
    { label: "Manage Season", hint: "Founder", run: () => { closeModal(); openSeasonModal(); } },
    { label: "Toggle Sidebar", hint: "View", run: () => { closeModal(); STATE.ui.sidebarCollapsed = !STATE.ui.sidebarCollapsed; saveState(); renderApp(); } },
    { label: "Export Data (JSON)", hint: "Data", run: () => { closeModal(); exportDataAsJSON(); } },
    { label: "Keyboard Shortcuts", hint: "Help", run: () => { closeModal(); openShortcutsModal(); } },
    { label: "Help Center", hint: "Help", run: () => { closeModal(); openHelpCenterModal(); } },
    { label: "Send Feedback", hint: "Help", run: () => { closeModal(); STATE.ui.helpCenterTab = "feedback"; saveState(); openHelpCenterModal(); } }
  );
  return commands;
}

function openCommandPalette(){
  const commands = getCommandList();
  let filtered = commands;
  let activeIndex = 0;

  const renderRows = () => filtered.length
    ? filtered.map((c, i) => `
        <div class="palette-row ${i === activeIndex ? "active" : ""}" data-index="${i}">
          <span class="palette-row-label">${escapeHtml(c.label)}</span>
          <span class="palette-row-hint">${escapeHtml(c.hint)}</span>
        </div>`).join("")
    : `<div class="palette-empty">No matching commands</div>`;

  openModal(`
    <div class="palette-search-row">
      ${icon("search")}
      <input type="text" class="palette-input" id="paletteInput" placeholder="Search commands or navigate…" autocomplete="off" />
    </div>
    <div class="palette-list" id="paletteList">${renderRows()}</div>
    <div class="palette-footer">
      <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> navigate</span>
      <span><kbd>&crarr;</kbd> select</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  `, (root) => {
    root.classList.add("modal-palette");
    const input = root.querySelector("#paletteInput");
    const listEl = root.querySelector("#paletteList");
    input.focus();

    const bindRowClicks = () => {
      listEl.querySelectorAll(".palette-row").forEach(row => {
        row.addEventListener("click", () => {
          const cmd = filtered[Number(row.getAttribute("data-index"))];
          if(cmd) cmd.run();
        });
      });
    };
    const update = () => {
      listEl.innerHTML = renderRows();
      bindRowClicks();
      const activeEl = listEl.querySelector(".palette-row.active");
      if(activeEl) activeEl.scrollIntoView({ block: "nearest" });
    };
    bindRowClicks();

    input.addEventListener("input", () => {
      const q = input.value.trim().toLowerCase();
      filtered = q ? commands.filter(c => c.label.toLowerCase().includes(q)) : commands;
      activeIndex = 0;
      update();
    });

    input.addEventListener("keydown", (e) => {
      if(e.key === "ArrowDown"){ e.preventDefault(); activeIndex = Math.min(filtered.length - 1, activeIndex + 1); update(); }
      else if(e.key === "ArrowUp"){ e.preventDefault(); activeIndex = Math.max(0, activeIndex - 1); update(); }
      else if(e.key === "Enter"){ e.preventDefault(); if(filtered[activeIndex]) filtered[activeIndex].run(); }
    });
  });
}

function openHelpCenterModal(){
  openModal(renderHelpCenterContent(), (root) => bindHelpCenterEvents(root));

function renderHelpCenterContent(){
  const tab = STATE.ui.helpCenterTab;

// Bound once, to document, in initApp — persists across every re-render
// rather than being re-attached on each renderApp() call.
function bindGlobalKeyboardShortcuts(){
  document.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName || "").toLowerCase();
    const isTyping = tag === "input" || tag === "textarea" || tag === "select" || (e.target && e.target.isContentEditable);

    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){
      e.preventDefault();
      openCommandPalette();
      return;
    }
    if(e.key === "?" && !isTyping){
      e.preventDefault();
      openShortcutsModal();
    }
  });
}

/* ==========================================================================
   SECTION: ONBOARDING (Welcome + Setup Wizard)
   Shown only when meta.onboardingComplete is false — i.e. a genuinely empty
   console. Existing consoles are migrated straight past this. Resolves a
   real tension in the spec: "auto-generate sample data on first launch" vs.
   "personalize the setup" — by making the very first choice the founder's.
   ========================================================================== */
/* ==========================================================================
   SECTION: SPLASH SCREEN
   Plays once per real page load, gated by the in-memory splashShownThisLoad
   flag (see renderApp() and scheduleSplashDismiss() below) — deliberately
   NOT persisted, so a real reload always shows it again while in-app
   navigation (navigateTo(), etc.) never does. Pure presentation: no data,
   no actions, no [data-action] elements, so it doesn't need
   bindOnboardingEvents() or enhanceAccessibility(). Timing/animation lives
   in the .splash-* CSS rules (see the SPLASH SCREEN section of the
   stylesheet) — those numbers are the tuned Brand OS values and must stay
   in lockstep with the constant below if either ever changes.
   ========================================================================== */
function renderSplash(){
  return `
  <div class="splash-shell" role="status" aria-label="Founder OS is loading">
    <div class="splash-stage">
      <img class="splash-mark" src="${AW_MONOGRAM_LOGO_DATA_URI}" alt="" />
      <img class="splash-word" src="${FOUNDEROS_LOGO_DATA_URI}" alt="Founder OS" />
    </div>
  </div>`;
}

// Total on-screen time must match the CSS timeline exactly (see the
// splashMarkIn/splashWordIn/splashOverlayOut keyframes and their
// prefers-reduced-motion override): 2950ms for the full staged sequence
// (1950ms mark/word reveal + 600ms hold + 400ms fade-out), or 720ms for the
// reduced-motion simple fade (500ms delay + 220ms fade). CSS can't hand a
// number back to JS, so these two durations are intentionally kept in
// lockstep by hand — if one changes, so must the other.
function scheduleSplashDismiss(){
  const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const totalMs = reducedMotion ? 720 : 2950;
  setTimeout(() => {
    splashShownThisLoad = true;
    renderApp(); // resumes whatever screen STATE already says — onboarding,
                 // a deep-in-flow view, focus mode, etc. — untouched by the splash
  }, totalMs);
}

// drops the founder into the wizard rather than the Welcome screen, since
// choosing this action from the banner already IS their choice to set up
// for real; showing Welcome again would just make them pick a second time.
function switchToRealSetup(){
  if(!confirm("This replaces your demo data with a blank console so you can set up the real thing. This can't be undone. Continue?")) return;
  STATE = getDefaultState();
  STATE.meta.onboardingComplete = false;
  STATE.meta.startedFromDemo = false;

  const draft = STATE.ui.onboardingDraft;
  const founder = FounderProfileModel({

  });

  const business = BusinessModel({ name: draft.businessName.trim() || "My Business", status: "ontrack" });

    name: seasonNameMap[draft.seasonGoal] || "BUILD",

  const starterMission = MissionModel({
    title: "Set up your operating system",

    priority: "high", estimatedMinutes: 60, impactScore: 8,

}

// Positions the spotlight cutout over the current step's target(s) — one
// data-tour key, several (unioned into one bounding box), or none (falls
// back to #mainContent, i.e. the whole screen minus sidebar/topbar). Uses
// position:absolute + scroll offsets rather than position:fixed so the
// spotlight scrolls naturally with the page instead of needing to be
// recomputed mid-scroll. Called once per render, after the real DOM exists.
function positionTourSpotlight(){
  const spotlight = document.getElementById("tourSpotlight");
  if(!spotlight) return;
  const step = TOUR_STEPS[STATE.meta.tourStepIndex];
  const keys = step && step.target ? (Array.isArray(step.target) ? step.target : [step.target]) : null;

  let els = [];
  if(keys) els = keys.map(k => document.querySelector(`[data-tour="${k}"]`)).filter(Boolean);
  if(!els.length){
    const mainContent = document.getElementById("mainContent");
    if(mainContent) els = [mainContent];
  }
  if(!els.length){ spotlight.style.opacity = "0"; return; }

  const rects = els.map(el => el.getBoundingClientRect());
  const rect = {
    top: Math.min(...rects.map(r => r.top)),
    left: Math.min(...rects.map(r => r.left)),
    right: Math.max(...rects.map(r => r.right)),
    bottom: Math.max(...rects.map(r => r.bottom)),
  };
  const pad = 8;
  spotlight.style.opacity = "1";
  spotlight.style.top = (rect.top + window.scrollY - pad) + "px";
  spotlight.style.left = (rect.left + window.scrollX - pad) + "px";
  spotlight.style.width = (rect.right - rect.left + pad * 2) + "px";
  spotlight.style.height = (rect.bottom - rect.top + pad * 2) + "px";

  const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  els[0].scrollIntoView({ block: "center", behavior: reducedMotion ? "auto" : "smooth" });
}

// Step index now drives currentView (not the other way around, like before
// sub-steps existed) — a screen can host more than one consecutive step, so
// currentView alone can no longer uniquely identify which step you're on.
// This is also why sidebar nav is disabled during the tour (see .sidebar
// .touring CSS and renderSidebar()): a manual nav-item click would change
// currentView without moving tourStepIndex, desyncing the overlay from the
// screen underneath it.
function tourGoToStep(delta){
  const next = STATE.meta.tourStepIndex + delta;
  if(next < 0 || next >= TOUR_STEPS.length) return;
  STATE.meta.tourStepIndex = next;
  STATE.ui.currentView = TOUR_STEPS[next].viewId;
  saveState();
  renderApp();
}

function renderApp(){
  const root = document.getElementById("app");

  if(!splashShownThisLoad){
    root.innerHTML = renderSplash();
    scheduleSplashDismiss();
    return;
  }

  if(!STATE.meta.onboardingComplete){
    root.innerHTML = renderOnboarding();
    enhanceAccessibility(root);
    bindOnboardingEvents();
    return;
  }

  const inFullscreenFocus = STATE.ui.currentView === "focus" && STATE.focusSession;
  if(inFullscreenFocus){
    const html = renderFocusModeFullscreen();
    if(html){
      root.innerHTML = html;
      enhanceAccessibility(root);
      bindFocusModeShellEvents();
      startLiveTimers();
      return;
    }
    // renderFocusModeFullscreen() returns null if the session's mission was
    // deleted out from under it — fall through to the normal shell below.
  }
  root.innerHTML = renderSidebar() + renderMain() + (STATE.meta.tourActive ? renderTourOverlay() : "");
  enhanceAccessibility(root);
  bindEvents();
  startLiveTimers();
  if(STATE.meta.tourActive) requestAnimationFrame(positionTourSpotlight);
}

      saveState();

  const enterFocusBtn = document.querySelector('[data-action="enter-focus-mode"]');

    enterFocusBtn.addEventListener("click", () => navigateTo("focus"));
  }

  const stopFocusBtn = document.querySelector('[data-action="stop-focus"]');

    stopFocusBtn.addEventListener("click", () => {
      pauseFocusSession();
      renderApp();
      showToast("Focus session paused");

  const motionToggle = document.querySelector('[data-action="toggle-motion"]');
  if(motionToggle){
    motionToggle.addEventListener("click", () => {
      STATE.ui.reducedMotionPref = !STATE.ui.reducedMotionPref;

      renderApp();

    sidebarDefaultToggle.addEventListener("click", () => {
      STATE.ui.sidebarCollapsed = !STATE.ui.sidebarCollapsed;
      saveState();
      renderApp();
    });

  const exportBtn = document.querySelector('[data-action="export-data"]');

    exportBtn.addEventListener("click", exportDataAsJSON);

  const importInput = document.getElementById("importFileInput");
  const importTriggerBtn = document.getElementById("importTriggerBtn");

    importTriggerBtn.addEventListener("click", () => importInput.click());
  }
  if(importInput){
    importInput.addEventListener("change", () => {
      if(importInput.files && importInput.files[0]){
        if(confirm("Importing will replace everything currently in your console with the contents of this file. Continue?")){
          importDataFromFile(importInput.files[0]);

        importInput.value = "";

  bindMissionEvents();
  bindRecoveryEvents();
  bindOpportunityEvents();
  bindIdeaVaultEvents();
  bindJournalEvents();
  bindContactsEvents();
  bindKnowledgeEvents();
  bindNotesEvents();

/* --------------------------------------------------------------------------
   CONTENT PIPELINE
   Every deliverable — reel, post, video — from idea through published, per
   platform. Distinct from Missions: a Mission is the work session that
   produces a piece of content; a Content item is the deliverable itself and
   where it stands with the client/platform.
   -------------------------------------------------------------------------- */
function renderContentPipeline(){
  if(STATE.ui.contentViewMode === "calendar") return renderContentCalendar();

  const filterBiz = STATE.ui.contentFilterBusinessId;
  const filterProj = STATE.ui.contentFilterProjectId;
  let items = STATE.contentItems.slice();
  if(filterBiz !== "all") items = items.filter(c => c.businessId === filterBiz);
  if(filterProj !== "all") items = items.filter(c => c.projectId === filterProj);

  const bizOptions = STATE.businesses.map(b => `<option value="${b.id}" ${filterBiz === b.id ? "selected" : ""}>${escapeHtml(b.name)}</option>`).join("");
  const projOptionsForFilter = (filterBiz === "all" ? STATE.projects : projectsForBusiness(filterBiz))
    .map(p => `<option value="${p.id}" ${filterProj === p.id ? "selected" : ""}>${escapeHtml(p.name)}</option>`).join("");

  const stageOptionsHtml = (selected) => CONTENT_STAGES.map(s =>
    `<option value="${s}" ${s === selected ? "selected" : ""}>${s[0].toUpperCase() + s.slice(1)}</option>`
  ).join("");

  const sections = CONTENT_STAGES.map(stage => {
    const inStage = items.filter(c => c.stage === stage);
    if(!inStage.length) return "";
    const cards = inStage.map(c => {
      const biz = businessById(c.businessId);
      const proj = c.projectId ? projectById(c.projectId) : null;
      const client = proj && proj.clientContactId ? contactById(proj.clientContactId) : null;
      const overdue = c.dueDate && c.dueDate < Date.now() && c.stage !== "published";
      return `
      <div class="mission-card glass">
        <div class="mission-card-top">
          <div class="mission-main">
            <div class="mission-title">${escapeHtml(c.title)}</div>
            <div class="mission-meta">
              <span class="tag tag-biz">${biz ? escapeHtml(biz.name) : ""}</span>
              <span class="tag" style="background:rgba(255,255,255,0.06);color:var(--text-secondary);">${escapeHtml(c.platform)}</span>
              ${proj ? `<span class="tag" style="background:rgba(255,255,255,0.06);color:var(--text-secondary);">${escapeHtml(proj.name)}</span>` : ""}
              ${client ? `<span class="tag" style="background:rgba(255,255,255,0.06);color:var(--text-secondary);">${icon("users")} ${escapeHtml(client.name)}</span>` : ""}
              ${c.dueDate ? `<span class="tag" style="background:${overdue ? "var(--red-dim)" : "rgba(255,255,255,0.06)"};color:${overdue ? "var(--red)" : "var(--text-tertiary)"};">Due ${escapeHtml(relativeFutureLabel(c.dueDate))}</span>` : ""}
            </div>
            ${c.notes ? `<div class="opportunity-notes">${escapeHtml(c.notes)}</div>` : ""}
          </div>
          <div class="mission-card-actions">
            <select class="filter-select stage-select" data-action="move-content-stage" data-id="${c.id}">${stageOptionsHtml(c.stage)}</select>
            <button class="icon-btn" data-action="edit-content-item" data-id="${c.id}" title="Edit">${icon("edit")}</button>
            <button class="icon-btn" data-action="delete-content-item" data-id="${c.id}" title="Delete">${icon("trash")}</button>
          </div>
        </div>
      </div>`;
    }).join("");
    return `
    <div class="stage-header">${stage} <span class="stage-count">${inStage.length}</span></div>
    ${cards}`;
  }).join("");

  return `
  <div class="view-enter">
    <div class="toolbar">
      <div class="toolbar-filters">
        <button class="tab-btn active" data-action="content-view-pipeline">${icon("pipeline")} Pipeline</button>
        <button class="tab-btn" data-action="content-view-calendar">${icon("grid")} Calendar</button>
        <select class="filter-select" data-action="filter-content-business">
          <option value="all">All businesses</option>
          ${bizOptions}
        </select>
        <select class="filter-select" data-action="filter-content-project">
          <option value="all">All projects</option>
          ${projOptionsForFilter}
        </select>
      </div>
      <button class="btn btn-primary" data-action="new-content-item">${icon("plus")} New content</button>
    </div>
    ${sections || `<div class="card glass col-12">${emptyState("content", "Nothing in the pipeline yet", "Add the first piece of content to start tracking it from idea through published.")}</div>`}
  </div>`;
}

// Same underlying data as the Pipeline view, grouped by publish date (falling
// back to due date if nothing's scheduled to publish yet) instead of stage —
// answers "what's going out this month" rather than "what's stuck where".
function renderContentCalendar(){
  const filterBiz = STATE.ui.contentFilterBusinessId;
  const filterProj = STATE.ui.contentFilterProjectId;
  let items = STATE.contentItems.filter(c => c.publishDate || c.dueDate);
  if(filterBiz !== "all") items = items.filter(c => c.businessId === filterBiz);
  if(filterProj !== "all") items = items.filter(c => c.projectId === filterProj);

  const bizOptions = STATE.businesses.map(b => `<option value="${b.id}" ${filterBiz === b.id ? "selected" : ""}>${escapeHtml(b.name)}</option>`).join("");
  const projOptionsForFilter = (filterBiz === "all" ? STATE.projects : projectsForBusiness(filterBiz))
    .map(p => `<option value="${p.id}" ${filterProj === p.id ? "selected" : ""}>${escapeHtml(p.name)}</option>`).join("");

  const offset = STATE.ui.contentCalendarMonthOffset;
  const today = new Date();
  const viewDate = new Date(today.getFullYear(), today.getMonth() + offset, 1);
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const monthLabel = viewDate.toLocaleDateString(undefined, { month: "long", year: "numeric" });

  const byDay = {};
  items.forEach(c => {
    const key = dateKeyFor(c.publishDate || c.dueDate);
    (byDay[key] = byDay[key] || []).push(c);
  });

  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = firstOfMonth.getDay(); // 0 = Sunday
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayKey = dateKeyFor(Date.now());

  let cells = "";
  for(let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell cal-cell-empty"></div>`;
  for(let day = 1; day <= daysInMonth; day++){
    const cellDate = new Date(year, month, day);
    const key = dateKeyFor(cellDate.getTime());
    const dayItems = byDay[key] || [];
    const chips = dayItems.slice(0, 3).map(c => `
      <div class="cal-chip" data-action="edit-content-item" data-id="${c.id}" title="${escapeHtml(c.title)} — ${escapeHtml(c.platform)}">
        ${escapeHtml(c.title.length > 24 ? c.title.slice(0, 24) + "…" : c.title)}
      </div>`).join("");
    const more = dayItems.length > 3 ? `<div class="cal-chip-more">+${dayItems.length - 3} more</div>` : "";
    cells += `
    <div class="cal-cell ${key === todayKey ? "cal-cell-today" : ""}">
      <div class="cal-daynum">${day}</div>
      ${chips}${more}
    </div>`;
  }

  return `
  <div class="view-enter">
    <div class="toolbar">
      <div class="toolbar-filters">
        <button class="tab-btn" data-action="content-view-pipeline">${icon("pipeline")} Pipeline</button>
        <button class="tab-btn active" data-action="content-view-calendar">${icon("grid")} Calendar</button>
        <select class="filter-select" data-action="filter-content-business">
          <option value="all">All businesses</option>
          ${bizOptions}
        </select>
        <select class="filter-select" data-action="filter-content-project">
          <option value="all">All projects</option>
          ${projOptionsForFilter}
        </select>
      </div>
      <button class="btn btn-primary" data-action="new-content-item">${icon("plus")} New content</button>
    </div>
    <div class="card glass col-12">
      <div class="cal-header">
        <button class="icon-btn" data-action="content-cal-prev" title="Previous month">${icon("chevron")}</button>
        <div class="cal-month-label">${monthLabel}</div>
        <button class="icon-btn" data-action="content-cal-next" title="Next month" style="transform:scaleX(-1);">${icon("chevron")}</button>
      </div>
      <div class="cal-weekdays">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="cal-grid">${cells}</div>
    </div>
  </div>`;
}

let liveTimerIntervals = [];
function startLiveTimers(){
  liveTimerIntervals.forEach(clearInterval);
  liveTimerIntervals = [];
  document.querySelectorAll("[data-live-timer]").forEach(timerEl => {
    const startedAt = Number(timerEl.getAttribute("data-live-timer"));
    const tick = () => { timerEl.textContent = formatDuration(Date.now() - startedAt); };
    tick();
    liveTimerIntervals.push(setInterval(tick, 1000));
  });
  document.querySelectorAll("[data-live-remaining]").forEach(el => {
    let cfg;
    try{ cfg = JSON.parse(el.getAttribute("data-live-remaining")); }catch(e){ return; }
    const tick = () => {
      const liveMin = (Date.now() - cfg.startedAt) / 60000;
      const remaining = Math.max(0, Math.round(cfg.estimatedMinutes - cfg.timeSpentMinutes - liveMin));
      el.textContent = `${remaining}m remaining of ${formatMinutes(cfg.estimatedMinutes)} estimated`;
    };
    tick();
    liveTimerIntervals.push(setInterval(tick, 1000));
  });
}

   SECTION: INITIALIZATION
   Defensive boot sequence: wait for DOM, verify the mount point exists,
   load or generate state, and never let an unexpected error produce a blank
   screen — render a recovery notice instead.
   ========================================================================== */
function renderFatalError(err){
  const root = document.getElementById("app");
  if(!root) return;
  root.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;padding:24px;">
      <div class="card glass" style="max-width:480px;text-align:center;">
        <h3 class="card-title" style="justify-content:center;color:var(--red)">Founder OS hit a snag</h3>
        <p style="color:var(--text-secondary);font-size:13px;line-height:1.6;">
          Something went wrong on startup. Your saved data has not been touched.
          Try reloading — if this keeps happening, resetting the console from Settings will restore a clean state.
        </p>
        <button class="btn btn-primary" onclick="location.reload()" style="margin-top:12px;">Reload console</button>
      </div>
    </div>`;
  console.error("Founder OS fatal error:", err);
}

/* ==========================================================================
   SECTION: GLOBAL ERROR BOUNDARY
   initApp()'s try/catch only guards startup. Once the app is running, a bug
   in a click handler could otherwise fail silently (console-only) and leave
   the UI looking dead with no explanation. These two handlers catch anything
   that slips through, keep the app alive, and tell the founder plainly.
   ========================================================================== */
window.addEventListener("error", (event) => {
  console.error("Founder OS: unhandled runtime error", event.error || event.message);
  showToast("Something went wrong, but your data is safe", "warn");
});
window.addEventListener("unhandledrejection", (event) => {
  console.error("Founder OS: unhandled promise rejection", event.reason);
  showToast("Something went wrong, but your data is safe", "warn");
});

/* ==========================================================================
   SECTION: OPTIONAL PWA REGISTRATION
   Silently does nothing when opened via file:// (the primary, supported way
   to run this app) — service workers cannot register there at all. If this
   file is ever placed on a static host alongside sw.js, it registers and the
   app becomes installable. No effect either way on the single-file promise.
   ========================================================================== */
if("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {
      // No sw.js alongside this file — perfectly normal, nothing to do.
    });
  });
}

// Explicitly requests the self-hosted Poppins/Inter files so the very first
// screen (the splash, or whatever renders if it's already been seen) never
// flashes the system-stack fallback while assets/fonts/ loads in behind it.
// document.fonts.ready alone isn't enough here: it only resolves for fonts
// that have actually been *requested* by rendered text, and at this point
// nothing has rendered yet — so these two document.fonts.load() calls are
// what create that request. Wrapped in a short race against a timeout so a
// slow or missing font file (e.g. assets/fonts/ never got copied alongside
// this HTML file) can never hang app launch — it just falls through to the
// system stack in --font-display/--font-body, same as always.
function preloadCoreFonts(){
  if(!(document.fonts && document.fonts.load)){
    return Promise.resolve(); // very old browser — CSS fallback stack still renders fine
  }
  const requests = Promise.all([
    document.fonts.load('650 16px "Poppins"'),
    document.fonts.load('400 16px "Inter"'),
  ]).catch(() => {}); // missing/failed font files just mean the fallback stack is used
  const timeout = new Promise(resolve => setTimeout(resolve, 400));
  return Promise.race([requests, timeout]);
}

function initApp(){
  try{
    const root = document.getElementById("app");
    if(!root) throw new Error("Mount point #app not found");

    STATE = loadState();
    if(!STATE){
      // A genuinely empty console: show the Welcome screen and let the
      // founder choose between the Setup Wizard and the sample data demo,
      // rather than deciding for them. Nothing is persisted until they choose.
      STATE = getDefaultState();
    }
    // Recompute derived numbers on every app open — covers the case where
    // a saved session sits across a day boundary and "today" needs to reset.
    recalcMetrics(STATE);

    preloadCoreFonts().then(() => {
      renderApp();
      bindGlobalKeyboardShortcuts();
    }).catch(renderFatalError);
  }catch(err){
    renderFatalError(err);
  }
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", initApp);
}else{
  initApp();
}

})();
</script>
</body>
</html>
